name: CI

# Build + full correctness test suite as a fail-closed PR gate.
# Runs on every PR targeting main and on pushes to main. This is the automated
# gate that compiles the solution and runs the test suite before merge — the
# only other PR check (SonarCloud) neither builds nor tests the code.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs for the same ref (e.g. a new push to a PR branch)
# so only the latest commit is gated and CI minutes aren't wasted.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the gate only needs to read the repository contents.
permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test
    # The product's primary target is the Linux ProcessStack server, so the
    # required gate runs on Linux only to stay fast and deterministic.
    # A windows/macos matrix could be added later for cross-platform coverage,
    # but is intentionally omitted here to keep the required check lean.
    runs-on: ubuntu-latest
    # Fail fast instead of burning the 6-hour Actions default when something hangs (issue #144).
    # A normal run takes ~8-10 minutes end to end.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Install a .NET 10 SDK. The repo's global.json (when present) is
      # intentionally relaxed to roll forward on 10.0.x, so any 10.0 SDK is
      # compatible with it.
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Sextant.slnx

      - name: Build
        run: dotnet build Sextant.slnx --configuration Debug --no-restore

      # Runs the default correctness suite across all assemblies (~1080 tests).
      # The env-gated real-MSBuild integration tests stay skipped because
      # SEXTANT_RUN_MULTISLN is left unset — they're too slow/nondeterministic
      # for the required gate. Any test failure fails the job (default behavior).
      #
      # Hang guards (issue #144): a single test that makes no progress for 10
      # minutes gets its test host (and child processes) mini-dumped and killed,
      # which fails the run and names the hanging test instead of stalling the
      # job. The step timeout leaves room for the diagnostics upload below.
      # Node reuse and the MSBuild server are off so no build process spawned by
      # a test outlives it while holding its redirected output pipes.
      - name: Test
        timeout-minutes: 25
        env:
          MSBUILDDISABLENODEREUSE: '1'
          DOTNET_CLI_USE_MSBUILD_SERVER: '0'
        run: >-
          dotnet test Sextant.slnx --no-build --configuration Debug
          --blame-hang-timeout 10m --blame-hang-dump-type mini
          --results-directory TestResults

      # Hang dumps and blame sequence files only exist after a hang or crash, so
      # this uploads nothing on a normal failure or a passing run.
      - name: Upload test hang diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-hang-diagnostics
          path: |
            TestResults/**/*.dmp
            TestResults/**/Sequence_*.xml
          if-no-files-found: ignore
          retention-days: 7
