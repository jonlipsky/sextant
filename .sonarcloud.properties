# SonarCloud Automatic Analysis configuration.
#
# This project uses SonarCloud Automatic Analysis (no CI scanner), which reads this
# file (.sonarcloud.properties) at the repository root. sonar-project.properties is
# only honored by the CLI/CI scanner, which this project does not use.
#
# Scope analysis to the actual application surface:
#
#  * **/Migrations/*.sql — hand-written SQLite migration DDL. SonarCloud has no SQLite
#    analyzer, so its Oracle PL/SQL analyzer scans these files and raises false positives
#    that do not apply to SQLite, e.g.:
#      - plsql:DeleteOrUpdateWithoutWhereCheck on intentional, required full-table clears
#        (DELETE FROM symbols; ...) in the rebuild-required migration 007/011.
#      - plsql:CreateOrReplaceCheck on CREATE VIRTUAL TABLE ... USING fts5, a statement
#        that has no "CREATE OR REPLACE" form in SQLite.
#      - plsql:S1134 / plsql:S1135 on TODO/FIXME words inside an explanatory column comment.
#
#  * **/*.sh — shell helper scripts (e.g. scripts/install-cli.sh) are not part of the
#    analyzed .NET application surface.
#
# Excluding these prevents the same wrong-analyzer noise from recurring on future
# migrations and scripts. Application C#/source analysis is unaffected.
sonar.exclusions=**/Migrations/*.sql,**/*.sh
