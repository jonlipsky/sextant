name: sextant
description: >
  Sextant semantic code index for ProcessStack. A user watches the repositories they want indexed from
  chat ("watch owner/repo on main"), and agents start and check indexing jobs over MCP. Every watch is a
  repository grant held by the Sextant service (PUT /control/grants/self), so the service decides what
  each caller can see. GitHub repository events keep the watched branches indexed: a push records the
  tenant grant (PUT /control/grants/tenant) and advances its branch, a delete retires it, and a pull
  request indexes its base and head. A nightly reconcile heals whatever an event missed. The app stores no
  secrets or grants of its own; in v2.0.x it keeps the v1 enrolled rows in App State for a rollback.
  Semantic queries are served by the Sextant service, never proxied through these flows.

  The flows talk to the service through the sextant-control connection only. The platform signs the run's
  caller into each request (act=user for chat and MCP, act=application for repository events and the
  schedule), so no flow ever names a user.
version: 2.0.0
author: Sextant
license: MIT

# Only the two control processes are MCP tools. Orchestrations are never eligible, and the internal
# processes (ensure, legacy-dual-write, tenant-grant) stay out of `include`.
mcp:
  expose: true
  displayName: "Sextant"
  description: "Start and check Sextant indexing jobs for the repositories you watch."
  defaultTimeoutSeconds: 60
  include:
    - start-indexing
    - get-indexing-status

entrypoints:
  - name: configure-watched-repos
    description: >
      Chat: watch, unwatch and list the caller's repositories, or show help. Started by the conversation
      gateway on each prompt.
    type: orchestration
    path: orchestrations/configure-watched-repos.yaml
    isDefault: true

  - name: grant-watch
    description: >
      Watches one repository for the caller: checks that the workspace's GitHub connection can see it,
      records the grant, starts the first index when the branch has no snapshot, and keeps the legacy
      watched-repos memory in step.
    type: orchestration
    path: orchestrations/grant-watch.yaml
    internal: true

  - name: revoke-watch
    description: Stops watching one repository (one branch, or every branch) for the caller.
    type: orchestration
    path: orchestrations/revoke-watch.yaml
    internal: true

  - name: start-indexing
    description: Request (ensure) a Sextant snapshot for an exact commit of a watched repository and return its job reference
    type: process
    path: processes/start-indexing.yaml

  - name: get-indexing-status
    description: Read the current state of one Sextant indexing job by id
    type: process
    path: processes/get-indexing-status.yaml

  - name: ensure
    description: Sends one guarded POST /control/ensure and interprets the answer
    type: process
    path: processes/ensure.yaml
    internal: true

  - name: legacy-dual-write
    description: Mirrors a watch or unwatch into the v1 sextant.watched-repos user memory (dropped in v2.1)
    type: process
    path: processes/legacy-dual-write.yaml
    internal: true

  - name: on-repository-change
    description: >
      Keeps the service in step with a GitHub repository event (branch push or delete, pull request opened,
      synchronized or reopened). Started by the connection-event triggers; runs as the application.
    type: orchestration
    path: orchestrations/on-repository-change.yaml
    internal: true

  - name: reconcile
    description: >
      The nightly reconcile: lists the watched branches, imports the v1 enrolled rows as tenant grants, then
      brings every watched branch in line with GitHub. Started by the nightly-reconcile schedule; runs as the
      application.
    type: orchestration
    path: orchestrations/reconcile.yaml
    internal: true

  - name: reconcile-target
    description: Brings one watched (repository, branch) target in line with GitHub (one reconcile iteration)
    type: orchestration
    path: orchestrations/reconcile-target.yaml
    internal: true

  - name: tenant-grant
    description: Records one tenant-wide repository grant (PUT /control/grants/tenant); application callers only
    type: process
    path: processes/tenant-grant.yaml
    internal: true

connections:
  # The workspace's GitHub App connection. The chat flow asks it whether a repository is visible before
  # granting it, and reads branch heads from it.
  - id: github
    type: github
  # The Sextant service's MCP endpoint (bearer + signed caller identity). Its tools are exposed through
  # mcp.connectionTools in a later version; nothing calls it yet.
  - id: sextant-query
    type: mcp
  # The Sextant service's control plane (bearer + signed caller identity). Every HttpRequest step names it.
  - id: sextant-control
    type: http-api

triggers:
  # GitHub repository events. Each trigger names its event, and only the first matching trigger fires, so
  # every event starts on-repository-change once. The flow reads the normalized fields from `event.*` (every
  # value a string, "" when absent), so no inputs are mapped. The run's caller is the application, whoever
  # sent the event. Deliveries are not de-duplicated; every step is idempotent.
  - id: gh-push
    type: connection-event
    inputs:
      connection: github
      event: push
    action:
      type: start-orchestration
      orchestration: on-repository-change

  - id: gh-delete
    type: connection-event
    inputs:
      connection: github
      event: delete
    action:
      type: start-orchestration
      orchestration: on-repository-change

  - id: gh-pr-open
    type: connection-event
    inputs:
      connection: github
      event: pull_request.opened
    action:
      type: start-orchestration
      orchestration: on-repository-change

  - id: gh-pr-sync
    type: connection-event
    inputs:
      connection: github
      event: pull_request.synchronize
    action:
      type: start-orchestration
      orchestration: on-repository-change

  - id: gh-pr-reopen
    type: connection-event
    inputs:
      connection: github
      event: pull_request.reopened
    action:
      type: start-orchestration
      orchestration: on-repository-change

  # The nightly reconcile, as the application. At G2c the operator fires it once with the trigger run-now to
  # import the v1 enrolled rows.
  - id: nightly-reconcile
    type: schedule
    inputs:
      cron: "0 3 * * *"
      timezone: Etc/UTC
    action:
      type: start-orchestration
      orchestration: reconcile

  - id: prompt
    type: prompt
    listed: true
    action:
      type: start-orchestration
      orchestration: configure-watched-repos
      # The server stamps the identity and scope variables (senderId, conversationId, tenantId, ...) on
      # every turn; they are not mapped here, and no flow uses them. The service sees only the run's
      # caller.
      inputs:
        prompt: "= event.text"
        isFirstTurn: "= event.isFirstTurn"
        channelType: "= event.channelType"
        conversationState: "= event.conversationState"

chat:
  entryOrchestration: configure-watched-repos
  channels: [slack, web, api, cli]
  conversationDefaultsTo:
    slack: thread-ts
    web: explicit
    api: explicit
    cli: explicit

# The flows reach the service only through the connections (which sign the run's caller), and otherwise touch
# only the caller's own memory and the app's own App State (the v1 enrolled rows). None needs a permission.
permissions: []

testDirectory: tests
