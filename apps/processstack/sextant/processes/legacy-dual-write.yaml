name: legacy-dual-write
description: >
  Keeps the v1 app's per-user watched-repos memory in step with v2 watches during v2.0.x, so that rolling
  back to v1 loses nothing (dropped in v2.1). The key and value are exactly what v1 wrote: scope
  sextant.watched-repos, key {host}/{owner}/{repo}@{branch} (host lower-cased without userinfo or port,
  owner lower-cased, repo lower-cased without .git, branch trimmed), and the camelCase value
  {"owner","repo","branch","cloneUrl","addedAt"}. A removal writes the JSON null tombstone, which v1 skips.
  Memory is the caller's own (the *MyMemory activities never take a user id).

inputs:
  - name: operation
    type: string
    required: true
    description: upsert (a watch) or remove (an unwatch)
  - name: host
    type: string
    required: true
  - name: owner
    type: string
    required: true
  - name: repo
    type: string
    required: true
  - name: branch
    type: string
    required: true
    description: The watched branch; for remove, "*" means every branch of the repository
  - name: cloneUrl
    type: string
    required: false
    default: ""
    description: The repository URL recorded in the upserted value

variables:
  - name: slugPrefix
    type: string
    default: ""
  - name: facts
    type: json
  - name: queue
    type: json
  - name: currentKey
    type: string
    default: ""

outputs:
  - name: keys
    type: string
    description: The memory keys written (without the scope prefix), comma-separated
  - name: value
    type: string
    description: The value written for an upsert; "null" for a removal
  - name: count
    type: int

nodes:
  - id: start
    type: start
    next: init

  # ensure's caveat applies here too: a direct run is not refused (elevenworks/ProcessStack#3287) and an
  # undeclared input seeds a variable (elevenworks/ProcessStack#3286), so every variable and output is
  # assigned before anything reads it.
  - id: init
    name: Reset every variable and output
    type: activity:JavaScript
    inputs:
      script: |
        context.setVariable('slugPrefix', '');
        context.setVariable('facts', null);
        context.setVariable('queue', null);
        context.setVariable('currentKey', '');
        context.setVariable('keys', '');
        context.setVariable('value', '');
        context.setVariable('count', 0);
        null;
    next: prepare

  - id: prepare
    name: Compute the v1 slug
    type: activity:JavaScript
    inputs:
      script: |
        function normHost(h) {
          h = String(h || '').trim().replace(/^\/+|\/+$/g, '');
          var at = h.indexOf('@');
          if (at >= 0) h = h.substring(at + 1);
          if (h.indexOf(':') === h.lastIndexOf(':') && h.indexOf(':') >= 0) h = h.substring(0, h.indexOf(':'));
          return h.toLowerCase();
        }
        function normRepo(r) {
          r = String(r || '').trim().replace(/^\/+|\/+$/g, '');
          if (/\.git$/i.test(r)) r = r.substring(0, r.length - 4);
          return r.toLowerCase();
        }
        var prefix = normHost(host) + '/' + String(owner || '').trim().replace(/^\/+|\/+$/g, '').toLowerCase()
          + '/' + normRepo(repo) + '@';
        context.setVariable('keys', '');
        context.setVariable('count', 0);
        prefix;
    outputs:
      result: slugPrefix
    next: route-operation

  - id: route-operation
    type: decision
    next:
      - when: "operation == 'upsert'"
        next: build-value
      - when: "operation == 'remove'"
        next: list-memory
      - else: end

  - id: build-value
    name: Build the camelCase value
    type: activity:JavaScript
    inputs:
      script: |
        var b = String(branch || '').trim();
        context.setVariable('currentKey', slugPrefix + b);
        context.setVariable('keys', slugPrefix + b);
        context.setVariable('count', 1);
        JSON.stringify({ owner: owner, repo: repo, branch: b, cloneUrl: cloneUrl, addedAt: new Date().toISOString() });
    outputs:
      result: value
    next: write-upsert

  - id: write-upsert
    type: activity:SetMyMemory
    inputs:
      scope: sextant.watched-repos
      key: "= currentKey"
      value: "= value"
    next: end

  - id: list-memory
    type: activity:ListMyMemory
    inputs:
      scope: sextant.watched-repos
    outputs:
      facts: facts
    next: select-tombstones

  # Matches the way v1 removed an entry: by the value's owner/repo, host and branch, so an entry stored
  # under a non-canonical key is still found. An entry whose value does not parse matches by its key.
  - id: select-tombstones
    name: Select the entries to tombstone
    type: activity:JavaScript
    inputs:
      script: |
        function normHost(h) {
          h = String(h || '').trim().replace(/^\/+|\/+$/g, '');
          var at = h.indexOf('@');
          if (at >= 0) h = h.substring(at + 1);
          if (h.indexOf(':') === h.lastIndexOf(':') && h.indexOf(':') >= 0) h = h.substring(0, h.indexOf(':'));
          return h.toLowerCase();
        }
        function hostOf(url) {
          var m = /^[a-z][a-z0-9+.-]*:\/\/([^\/]*)/i.exec(String(url || '').trim());
          return m ? normHost(m[1]) : '';
        }
        function normRepo(r) {
          r = String(r || '').trim().replace(/^\/+|\/+$/g, '');
          if (/\.git$/i.test(r)) r = r.substring(0, r.length - 4);
          return r.toLowerCase();
        }
        var wantHost = normHost(host);
        var wantOwner = String(owner || '').trim().replace(/^\/+|\/+$/g, '').toLowerCase();
        var wantRepo = normRepo(repo);
        var wantBranch = String(branch || '').trim();
        var all = wantBranch === '*';
        var selected = [];
        var entries = facts || {};
        Object.keys(entries).forEach(function (key) {
          var raw = entries[key];
          if (raw == null || String(raw).trim() === '' || String(raw).trim() === 'null') return;
          var entry = null;
          try { entry = JSON.parse(String(raw)); } catch (e) { entry = null; }
          var match;
          if (entry && typeof entry === 'object') {
            var entryHost = hostOf(entry.cloneUrl || entry.CloneUrl);
            match = String(entry.owner || entry.Owner || '').trim().replace(/^\/+|\/+$/g, '').toLowerCase() === wantOwner
              && normRepo(entry.repo || entry.Repo) === wantRepo
              && (entryHost === '' || entryHost === wantHost)
              && (all || String(entry.branch || entry.Branch || '').trim() === wantBranch);
          } else {
            match = all ? key.indexOf(slugPrefix) === 0 : key === slugPrefix + wantBranch;
          }
          if (match) selected.push(key);
        });
        selected.sort();
        context.setVariable('keys', selected.join(','));
        context.setVariable('count', selected.length);
        selected;
    outputs:
      result: queue
    next: set-tombstone

  - id: set-tombstone
    type: activity:SetVariable
    inputs:
      value: "null"
    outputs:
      result: value
    next: tombstone-loop

  # Processes have no for-each node: each pass takes one key off the queue.
  - id: tombstone-loop
    type: decision
    next:
      - when: "queue != null && queue.length > 0"
        next: next-key
      - else: end

  - id: next-key
    type: activity:JavaScript
    inputs:
      script: |
        context.setVariable('currentKey', queue[0]);
        context.setVariable('queue', queue.slice(1));
        null;
    next: write-tombstone

  - id: write-tombstone
    type: activity:SetMyMemory
    inputs:
      scope: sextant.watched-repos
      key: "= currentKey"
      value: "null"
    next: tombstone-loop

  - id: end
    type: end
