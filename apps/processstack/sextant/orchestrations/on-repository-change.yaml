name: on-repository-change
description: >
  Keeps the Sextant service in step with one GitHub repository event: a branch push, a branch delete, or a
  pull request opened, synchronized or reopened. The connection-event triggers start it with the event's
  normalized fields in `event` (every value a string, "" when absent). SextantPlanRepositoryChange turns
  the event into the service bodies, and this flow sends them verbatim:
    - A branch push records the tenant grant (tenant-grant, PUT /control/grants/tenant), then sends the
      ensure: branch_update advance under the compare-and-swap expected_head_commit = before ("" for a new
      branch), default_branch when the event names the default, and forced for the audit. A default-branch
      push also upserts the v1 enrolled row in App State (enrolled/{connectionId}/{slug}).
    - A deleted push retires the branch under the CAS on before. A delete event has no head commit, so it
      retires without a CAS, and only after GitHub confirms the branch is still gone (a delete processed
      after a push that re-created the branch must not remove it). A default-branch retire removes the
      enrolled row.
    - A pull request publishes its base and head commits with branch_update none: no pointer moves.
    - A tag, a create event, a closed pull request or a malformed event is logged and ignored.

  A repository event runs as the application (act=application), whoever the sender is; senderLogin is never
  identity. The platform does not refuse a direct run of this entrypoint (elevenworks/ProcessStack#3287),
  and a direct run by a user runs as that user, with whatever `event` it passes. So the push ensure and the
  enrolled row wait for the tenant grant, which the service records for an application caller only: a user's
  run stops at the grant's 403. The service refuses a user's retire, and a pull request only publishes
  commits (branch_update none), within the service's own checks.

  Deliveries are not de-duplicated, so every step is idempotent: the grant and the enrolled row are upserts,
  a repeated ensure attaches to its job, and a repeated retire answers retired:false. A failed call is
  logged and the run completes; the nightly reconcile heals a missed advance for a granted repository.

variables:
  - name: ev
    type: json
  - name: planAction
    type: string
    default: ""
  - name: planReason
    type: string
    default: ""
  - name: ensureBody
    type: json
  - name: ensureBodies
    type: json
  - name: retireBody
    type: json
  - name: repository
    type: string
    default: ""
  - name: branchName
    type: string
    default: ""
  - name: isDefaultBranch
    type: bool
    default: false
  - name: connectionId
    type: string
    default: ""
  - name: grantReason
    type: string
    default: ""
  - name: ensureStatus
    type: int
    default: 0
  - name: ensureText
    type: string
    default: ""
  - name: headBody
    type: json
  - name: headStatus
    type: int
    default: 0
  - name: headText
    type: string
    default: ""
  - name: retireHasCas
    type: bool
    default: false
  - name: urlAccepted
    type: bool
    default: false
  - name: repoHost
    type: string
    default: ""
  - name: repoOwner
    type: string
    default: ""
  - name: repoName
    type: string
    default: ""
  - name: branches
    type: json
  - name: retireStatus
    type: int
    default: 0
  - name: retireText
    type: string
    default: ""

outputs:
  - name: action
    type: string
    description: ensure | retire | ignore (the plan)
  - name: reason
    type: string
    description: Why the plan ignored or degraded the event (tag, missing_before, ...); "" otherwise
  - name: grantOutcome
    type: string
    description: The tenant grant's outcome (push only); "" when none was requested
  - name: ensureOutcome
    type: string
    description: The push ensure's, or the pull request base ensure's, outcome; "" when none was sent
  - name: ensureReason
    type: string
  - name: headEnsureOutcome
    type: string
    description: The pull request head ensure's outcome; "" when none was sent
  - name: retireOutcome
    type: string
    description: The retire's outcome; "" when none was sent
  - name: retireReason
    type: string
  - name: retired
    type: bool
    description: True when the service deleted the branch
  - name: retireSkipped
    type: string
    description: Why a delete event's retire was not sent (branch_exists, github_unavailable, not_verifiable); "" otherwise
  - name: enrollment
    type: string
    description: recorded | removed | "" (the v1 enrolled row in App State)
  - name: enrolledKey
    type: string
  - name: enrolledValue
    type: string

nodes:
  - id: start
    type: start
    next: init

  # A run seeds variables from undeclared inputs, and a default only fills an unset name
  # (elevenworks/ProcessStack#3286). Every variable and output is assigned here, and only the event fields
  # the plan reads are copied, each as a string.
  - id: init
    name: Reset every variable and output
    type: activity:JavaScript
    inputs:
      script: |
        var src = typeof event === 'undefined' || event == null || typeof event !== 'object' ? {} : event;
        var ev = {};
        ['event', 'action', 'connectionId', 'cloneUrl', 'defaultBranch', 'ref', 'refType', 'branch', 'before',
         'after', 'forced', 'deleted', 'baseSha', 'baseRef', 'headSha', 'headRef', 'headCloneUrl'
        ].forEach(function (name) {
          var value = src[name];
          ev[name] = value == null || typeof value === 'object' ? '' : String(value);
        });
        context.setVariable('ev', ev);
        ['planAction', 'planReason', 'repository', 'branchName', 'connectionId', 'grantReason', 'ensureText',
         'headText', 'repoHost', 'repoOwner', 'repoName', 'retireText', 'action', 'reason', 'grantOutcome',
         'ensureOutcome', 'ensureReason', 'headEnsureOutcome', 'retireOutcome', 'retireReason', 'retireSkipped',
         'enrollment', 'enrolledKey', 'enrolledValue'].forEach(function (name) {
          context.setVariable(name, '');
        });
        ['isDefaultBranch', 'retireHasCas', 'urlAccepted', 'retired'].forEach(function (name) {
          context.setVariable(name, false);
        });
        ['ensureStatus', 'headStatus', 'retireStatus'].forEach(function (name) {
          context.setVariable(name, 0);
        });
        ['ensureBody', 'ensureBodies', 'retireBody', 'headBody', 'branches'].forEach(function (name) {
          context.setVariable(name, null);
        });
        null;
    next: plan

  - id: plan
    name: Plan the service calls
    type: activity:SextantPlanRepositoryChange
    inputs:
      metadata: "= ev"
    outputs:
      action: planAction
      ensureBody: ensureBody
      ensureBodies: ensureBodies
      retireBody: retireBody
      reason: planReason
      repository: repository
      branchName: branchName
      isDefaultBranch: isDefaultBranch
    next: shape-plan

  # The connection id keys the enrolled row, so only a slash-free token is kept.
  - id: shape-plan
    name: Shape the plan
    type: activity:JavaScript
    inputs:
      script: |
        var code = String(planReason == null ? '' : planReason);
        context.setVariable('action', String(planAction || ''));
        context.setVariable('reason', /^[a-z0-9_]{1,64}$/.test(code) ? code : '');
        context.setVariable('retireHasCas', retireBody != null && typeof retireBody === 'object'
          && typeof retireBody.expected_head_commit === 'string' && retireBody.expected_head_commit !== '');
        context.setVariable('headBody', ensureBodies != null && ensureBodies.length > 1 ? ensureBodies[1] : null);
        var id = String(ev.connectionId || '').trim();
        context.setVariable('connectionId', /^[A-Za-z0-9_-]{1,128}$/.test(id) ? id : '');
        null;
    next: route-plan

  - id: route-plan
    type: decision
    next:
      - when: "planAction == 'retire' && retireBody != null && retireHasCas"
        next: post-retire
      - when: "planAction == 'retire' && retireBody != null"
        next: race-check-url
      - when: "planAction == 'ensure' && ensureBody != null && branchName != ''"
        next: grant
      - when: "planAction == 'ensure' && ensureBody != null"
        next: post-base
      - else: log-ignored

  - id: log-ignored
    type: activity:Log
    inputs:
      level: Info
      message: "= 'Sextant repository event ignored (' + (reason != '' ? reason : 'no_action') + ')'"
    next: end

  # ---- push: grant, ensure, enrolled row ----

  - id: grant
    type: process:tenant-grant
    inputs:
      repository: "= repository"
    outputs:
      outcome: grantOutcome
      reason: grantReason
    next: route-grant
    on-error: grant-failed

  - id: grant-failed
    type: activity:JavaScript
    inputs:
      script: |
        context.setVariable('grantOutcome', 'unavailable');
        context.setVariable('grantReason', 'no_response');
        null;
    next: route-grant

  # Only an application caller gets 200 or 409 grant_limit from PUT /control/grants/tenant, so anything else
  # (a user's direct run gets 403) sends nothing further. A missed ensure is healed by the next push or the
  # nightly reconcile.
  - id: route-grant
    type: decision
    next:
      - when: "grantOutcome == 'granted' || grantOutcome == 'limit'"
        next: post-push
      - else: log-push-not-sent

  - id: log-push-not-sent
    type: activity:Log
    inputs:
      level: Warning
      message: "= 'Sextant push ensure was not sent: the tenant grant was ' + grantOutcome + ' (' + grantReason + ')'"
    next: end

  - id: post-push
    name: POST /control/ensure (push)
    type: activity:HttpRequest
    inputs:
      connectionId: sextant-control
      method: POST
      url: /control/ensure
      query:
        wait: "false"
      body: "= ensureBody"
      failOnErrorStatus: false
    outputs:
      statusCode: ensureStatus
      body: ensureText
    next: interpret-push
    on-error: push-no-response

  - id: push-no-response
    type: activity:SetVariable
    inputs:
      value: 0
    outputs:
      result: ensureStatus
    next: interpret-push

  - id: interpret-push
    type: activity:SextantInterpretEnsureResult
    inputs:
      statusCode: "= ensureStatus"
      body: "= ensureText"
      branchUpdate: "= ensureBody.branch_update"
      operation: ensure
    outputs:
      outcome: ensureOutcome
      reason: ensureReason
    next: shape-push

  - id: shape-push
    name: Keep reason codes only
    type: activity:JavaScript
    inputs:
      script: |
        var code = String(ensureReason == null ? '' : ensureReason);
        var ok = ensureOutcome === 'ok' || ensureOutcome === 'attached';
        context.setVariable('ensureReason', /^[a-z0-9_]{1,64}$/.test(code) ? code : (ok ? '' : 'http_' + ensureStatus));
        null;
    next: route-push

  - id: route-push
    type: decision
    next:
      - when: "ensureOutcome == 'ok' || ensureOutcome == 'attached'"
        next: route-enroll
      - else: log-push

  - id: log-push
    type: activity:Log
    inputs:
      level: Warning
      message: "= 'Sextant push ensure was not accepted: ' + ensureOutcome + ' (' + ensureReason + ', HTTP ' + ensureStatus + ')'"
    next: route-enroll

  # The enrolled row mirrors the tenant grant for the v1 rollback and the nightly import, so it is written
  # only when this call recorded (or held) the grant: never for a run the service did not accept as the
  # application.
  - id: route-enroll
    type: decision
    next:
      - when: "grantOutcome == 'granted' && isDefaultBranch && connectionId != ''"
        next: enroll-parse
      - else: end

  - id: enroll-parse
    type: activity:SextantNormalizeRepository
    inputs:
      cloneUrl: "= repository"
    outputs:
      accepted: urlAccepted
      host: repoHost
      repositoryOwner: repoOwner
      repositoryName: repoName
    next: enroll-build

  # v1's EnrolledRepoState: key enrolled/{connectionId}/{slug} with the host-aware slug
  # {host}/{owner}/{repo}@{branch} (host, owner and repo lower-cased, repo without .git, branch trimmed) and
  # the PascalCase value {ConnectionId, Host, Owner, Repo, Branch, CloneUrl, Slug, EnrolledAt}.
  - id: enroll-build
    name: Build the enrolled row
    type: activity:JavaScript
    inputs:
      script: |
        var host = String(repoHost || '').trim().toLowerCase();
        var owner = String(repoOwner || '').trim().replace(/^\/+|\/+$/g, '').toLowerCase();
        var repo = String(repoName || '').trim().replace(/^\/+|\/+$/g, '');
        if (/\.git$/i.test(repo)) repo = repo.substring(0, repo.length - 4);
        repo = repo.toLowerCase();
        var branch = String(branchName || '').trim();
        if (urlAccepted === true && host !== '' && owner !== '' && repo !== '' && branch !== '') {
          var slug = host + '/' + owner + '/' + repo + '@' + branch;
          context.setVariable('enrolledKey', 'enrolled/' + connectionId + '/' + slug);
          context.setVariable('enrolledValue', JSON.stringify({
            ConnectionId: connectionId, Host: host, Owner: owner, Repo: repo, Branch: branch,
            CloneUrl: String(repository).trim(), Slug: slug, EnrolledAt: new Date().toISOString()
          }));
        }
        null;
    next: route-enroll-write

  - id: route-enroll-write
    type: decision
    next:
      - when: "enrolledKey != ''"
        next: enroll-write
      - else: end

  - id: enroll-write
    type: activity:SetAppValue
    inputs:
      key: "= enrolledKey"
      value: "= enrolledValue"
    next: mark-enrolled
    on-error: log-enroll-failed

  - id: mark-enrolled
    type: activity:SetVariable
    inputs:
      value: recorded
    outputs:
      result: enrollment
    next: end

  - id: log-enroll-failed
    type: activity:Log
    inputs:
      level: Warning
      message: "= 'Sextant push: the enrolled row was not written: ' + _lastErrorType"
    next: end

  # ---- delete: retire ----

  # A delete event carries no head commit, so its retire has no CAS. Before sending it, GitHub must still
  # lack the branch; anything that cannot be confirmed keeps the branch.
  - id: race-check-url
    type: activity:SextantNormalizeRepository
    inputs:
      cloneUrl: "= repository"
    outputs:
      accepted: urlAccepted
      host: repoHost
      repositoryOwner: repoOwner
      repositoryName: repoName
    next: route-race-url

  - id: route-race-url
    type: decision
    next:
      - when: "urlAccepted && repoHost == 'github.com'"
        next: race-list
      - else: skip-unverifiable

  - id: skip-unverifiable
    type: activity:SetVariable
    inputs:
      value: not_verifiable
    outputs:
      result: retireSkipped
    next: log-retire-skipped

  - id: race-list
    name: Is the branch still gone on GitHub?
    type: activity:GitHubListBranches
    inputs:
      connectionId: github
      owner: "= repoOwner"
      repo: "= repoName"
    outputs:
      branches: branches
    next: race-check
    on-error: skip-github-unavailable

  - id: skip-github-unavailable
    type: activity:SetVariable
    inputs:
      value: github_unavailable
    outputs:
      result: retireSkipped
    next: log-retire-skipped

  - id: race-check
    type: activity:SetVariable
    inputs:
      value: >
        = branches == null || typeof branches.some !== 'function' ? 'github_unavailable'
          : branches.some(function (b) { return b && b.name === branchName; }) ? 'branch_exists' : ''
    outputs:
      result: retireSkipped
    next: route-race

  - id: route-race
    type: decision
    next:
      - when: "retireSkipped == ''"
        next: post-retire
      - else: log-retire-skipped

  - id: log-retire-skipped
    type: activity:Log
    inputs:
      level: Info
      message: "= 'Sextant delete event: the retire was not sent (' + retireSkipped + ')'"
    next: end

  - id: post-retire
    name: POST /control/branches/retire
    type: activity:HttpRequest
    inputs:
      connectionId: sextant-control
      method: POST
      url: /control/branches/retire
      body: "= retireBody"
      failOnErrorStatus: false
    outputs:
      statusCode: retireStatus
      body: retireText
    next: interpret-retire
    on-error: retire-no-response

  - id: retire-no-response
    type: activity:SetVariable
    inputs:
      value: 0
    outputs:
      result: retireStatus
    next: interpret-retire

  - id: interpret-retire
    type: activity:SextantInterpretEnsureResult
    inputs:
      statusCode: "= retireStatus"
      body: "= retireText"
      operation: retire
    outputs:
      outcome: retireOutcome
      reason: retireReason
      retired: retired
    next: shape-retire

  - id: shape-retire
    name: Keep reason codes only
    type: activity:JavaScript
    inputs:
      script: |
        var code = String(retireReason == null ? '' : retireReason);
        context.setVariable('retireReason', /^[a-z0-9_]{1,64}$/.test(code) ? code : (retireOutcome === 'ok' ? '' : 'http_' + retireStatus));
        context.setVariable('retired', retired === true);
        null;
    next: route-retire

  - id: route-retire
    type: decision
    next:
      - when: "retireOutcome == 'ok' && isDefaultBranch && connectionId != ''"
        next: unenroll-parse
      - when: "retireOutcome == 'ok'"
        next: end
      - else: log-retire

  - id: log-retire
    type: activity:Log
    inputs:
      level: Warning
      message: "= 'Sextant retire was not accepted: ' + retireOutcome + ' (' + retireReason + ', HTTP ' + retireStatus + ')'"
    next: end

  - id: unenroll-parse
    type: activity:SextantNormalizeRepository
    inputs:
      cloneUrl: "= repository"
    outputs:
      accepted: urlAccepted
      host: repoHost
      repositoryOwner: repoOwner
      repositoryName: repoName
    next: unenroll-build

  - id: unenroll-build
    name: Build the enrolled key
    type: activity:JavaScript
    inputs:
      script: |
        var host = String(repoHost || '').trim().toLowerCase();
        var owner = String(repoOwner || '').trim().replace(/^\/+|\/+$/g, '').toLowerCase();
        var repo = String(repoName || '').trim().replace(/^\/+|\/+$/g, '');
        if (/\.git$/i.test(repo)) repo = repo.substring(0, repo.length - 4);
        repo = repo.toLowerCase();
        var branch = String(branchName || '').trim();
        if (urlAccepted === true && host !== '' && owner !== '' && repo !== '' && branch !== '') {
          context.setVariable('enrolledKey', 'enrolled/' + connectionId + '/' + host + '/' + owner + '/' + repo + '@' + branch);
        }
        null;
    next: route-unenroll

  - id: route-unenroll
    type: decision
    next:
      - when: "enrolledKey != ''"
        next: unenroll
      - else: end

  - id: unenroll
    type: activity:DeleteAppValue
    inputs:
      key: "= enrolledKey"
    next: mark-unenrolled
    on-error: log-unenroll-failed

  - id: mark-unenrolled
    type: activity:SetVariable
    inputs:
      value: removed
    outputs:
      result: enrollment
    next: end

  - id: log-unenroll-failed
    type: activity:Log
    inputs:
      level: Warning
      message: "= 'Sextant retire: the enrolled row was not removed: ' + _lastErrorType"
    next: end

  # ---- pull request: base and head, branch_update none ----

  - id: post-base
    name: POST /control/ensure (pull request base)
    type: activity:HttpRequest
    inputs:
      connectionId: sextant-control
      method: POST
      url: /control/ensure
      query:
        wait: "false"
      body: "= ensureBody"
      failOnErrorStatus: false
    outputs:
      statusCode: ensureStatus
      body: ensureText
    next: interpret-base
    on-error: base-no-response

  - id: base-no-response
    type: activity:SetVariable
    inputs:
      value: 0
    outputs:
      result: ensureStatus
    next: interpret-base

  - id: interpret-base
    type: activity:SextantInterpretEnsureResult
    inputs:
      statusCode: "= ensureStatus"
      body: "= ensureText"
      branchUpdate: none
      operation: ensure
    outputs:
      outcome: ensureOutcome
      reason: ensureReason
    next: shape-base

  - id: shape-base
    name: Keep reason codes only
    type: activity:JavaScript
    inputs:
      script: |
        var code = String(ensureReason == null ? '' : ensureReason);
        var ok = ensureOutcome === 'ok' || ensureOutcome === 'attached';
        context.setVariable('ensureReason', /^[a-z0-9_]{1,64}$/.test(code) ? code : (ok ? '' : 'http_' + ensureStatus));
        null;
    next: route-base

  - id: route-base
    type: decision
    next:
      - when: "ensureOutcome == 'ok' || ensureOutcome == 'attached'"
        next: route-head
      - else: log-base

  - id: log-base
    type: activity:Log
    inputs:
      level: Warning
      message: "= 'Sextant pull request base ensure was not accepted: ' + ensureOutcome + ' (' + ensureReason + ', HTTP ' + ensureStatus + ')'"
    next: route-head

  - id: route-head
    type: decision
    next:
      - when: "headBody != null"
        next: post-head
      - else: end

  - id: post-head
    name: POST /control/ensure (pull request head)
    type: activity:HttpRequest
    inputs:
      connectionId: sextant-control
      method: POST
      url: /control/ensure
      query:
        wait: "false"
      body: "= headBody"
      failOnErrorStatus: false
    outputs:
      statusCode: headStatus
      body: headText
    next: interpret-head
    on-error: head-no-response

  - id: head-no-response
    type: activity:SetVariable
    inputs:
      value: 0
    outputs:
      result: headStatus
    next: interpret-head

  - id: interpret-head
    type: activity:SextantInterpretEnsureResult
    inputs:
      statusCode: "= headStatus"
      body: "= headText"
      branchUpdate: none
      operation: ensure
    outputs:
      outcome: headEnsureOutcome
    next: route-head-outcome

  - id: route-head-outcome
    type: decision
    next:
      - when: "headEnsureOutcome == 'ok' || headEnsureOutcome == 'attached'"
        next: end
      - else: log-head

  - id: log-head
    type: activity:Log
    inputs:
      level: Warning
      message: "= 'Sextant pull request head ensure was not accepted: ' + headEnsureOutcome + ' (HTTP ' + headStatus + ')'"
    next: end

  - id: end
    type: end
