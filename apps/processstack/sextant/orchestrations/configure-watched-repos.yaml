name: configure-watched-repos
description: >
  The chat entry point: watch, unwatch or list the repositories Sextant indexes for the calling user.
  Started on every prompt turn. The service sees only the run's caller assertion (act=user, idp=processstack),
  never the senderId variable, so a message can only change its own sender's grants.
    watch    → grant-watch per repository (GitHub visibility check, PUT /control/grants/self, first ensure)
    unwatch  → revoke-watch per repository (DELETE /control/grants/self)
    list     → GET /control/grants/self, formatted (branch, snapshot status, short commit)
    anything else → help
  Slack is refused in v2.0: a Slack peer's caller (idp=slack) is not a platform user, so every command
  replies "not enabled for this channel" and makes no service call.
  On an internal channel, the caller's v1 watches are imported once first (import-legacy-watches), until the
  sextant.app:legacy-import-v1 memory flag is set; the reply then starts with a note on what was imported.
  A reply is built from the service's typed fields only; a response body is never echoed.

inputs:
  # Hydrated by the prompt trigger. The reserved identity names (senderId, conversationId, tenantId, ...)
  # are deliberately not declared: the platform threads them itself and they are never read here.
  - name: prompt
    type: string
    required: false
  - name: isFirstTurn
    type: bool
    required: false
  - name: channelType
    type: string
    required: false
  - name: conversationState
    type: json
    required: false

variables:
  - name: verb
    type: string
    default: ""
  - name: repositories
    type: json
  - name: branch
    type: string
    default: ""
  - name: branchInvalid
    type: bool
    default: false
  - name: errors
    type: json
  - name: perRepo
    type: json
  - name: grantsStatus
    type: int
    default: 0
  - name: grantsJson
    type: json
  - name: agentResponse
    type: string
    default: ""
  - name: stateUpdate
    type: json
  - name: importDone
    type: bool
    default: false
  - name: importNote
    type: string
    default: ""
  - name: importMessage
    type: string
    default: ""
  - name: importOutcome
    type: string
    default: ""
  - name: importNewlyImported
    type: int
    default: 0
  - name: importSkipped
    type: int
    default: 0
  - name: importFailed
    type: int
    default: 0
  - name: importRemaining
    type: int
    default: 0

outputs:
  - name: agentResponse
    type: string
    description: The reply sent to the conversation
  - name: stateUpdate
    type: json
    description: Patch merged into the conversation state (nothing is kept there)
  - name: verb
    type: string
    description: The parsed command (watch, unwatch, list or help)

nodes:
  - id: start
    type: start
    next: init

  # Every variable and output is assigned before anything reads it: a default only fills an unset name, and
  # a run can seed one from an undeclared input (elevenworks/ProcessStack#3286).
  - id: init
    name: Reset every variable and output
    type: activity:JavaScript
    inputs:
      script: |
        context.setVariable('verb', '');
        context.setVariable('repositories', null);
        context.setVariable('branch', '');
        context.setVariable('branchInvalid', false);
        context.setVariable('errors', null);
        context.setVariable('perRepo', null);
        context.setVariable('grantsStatus', 0);
        context.setVariable('grantsJson', null);
        context.setVariable('agentResponse', '');
        context.setVariable('importDone', false);
        context.setVariable('importNote', '');
        context.setVariable('importMessage', '');
        context.setVariable('importOutcome', '');
        context.setVariable('importNewlyImported', 0);
        context.setVariable('importSkipped', 0);
        context.setVariable('importFailed', 0);
        context.setVariable('importRemaining', 0);
        null;
    next: init-state

  - id: init-state
    type: activity:SetVariable
    inputs:
      value: "= {}"
    outputs:
      result: stateUpdate
    next: slack-gate

  - id: slack-gate
    type: decision
    next:
      - when: "String(channelType || '').toLowerCase() == 'slack'"
        next: refuse-slack
      - else: read-import-flag

  # The one-time import of the caller's v1 watches (internal channels only: Slack is refused above). The
  # import sets the flag itself once nothing is left to retry, so it runs on each turn until then, and an
  # import run over MCP counts too.
  - id: read-import-flag
    type: activity:GetMyMemory
    inputs:
      scope: sextant.app
      key: legacy-import-v1
    outputs:
      found: importDone
    next: route-import
    on-error: log-import-flag

  - id: log-import-flag
    type: activity:Log
    inputs:
      level: Warning
      message: "Sextant legacy import: the import flag could not be read"
    next: parse

  - id: route-import
    type: decision
    next:
      - when: "importDone == true"
        next: parse
      - else: import-legacy

  - id: import-legacy
    type: process:import-legacy-watches
    inputs:
      retryUnresolved: false
    outputs:
      message: importMessage
      outcome: importOutcome
      newlyImported: importNewlyImported
      skipped: importSkipped
      failed: importFailed
      remaining: importRemaining
    next: note-import
    on-error: import-failed

  # Said once, before the reply to the command: nothing is said when there was nothing to import or every
  # entry was already watched.
  - id: note-import
    type: activity:SetVariable
    inputs:
      value: >
        = importOutcome != 'ok' || importNewlyImported > 0 || importSkipped > 0 || importFailed > 0 || importRemaining > 0
          ? String(importMessage || '') : ''
    outputs:
      result: importNote
    next: parse

  # A failed repository check fails the whole import; the entry it stopped at is tried last next time.
  - id: import-failed
    type: activity:SetVariable
    inputs:
      value: "I couldn't finish importing your earlier Sextant watches yet; I'll try again next time."
    outputs:
      result: importNote
    next: log-import

  - id: log-import
    type: activity:Log
    inputs:
      level: Warning
      message: "= 'Sextant legacy import failed: ' + _lastErrorType"
    next: parse

  - id: parse
    type: activity:SextantParseWatchCommand
    inputs:
      prompt: "= prompt || ''"
    outputs:
      verb: verb
      repositories: repositories
      branch: branch
      branchInvalid: branchInvalid
      errors: errors
    next: route

  # A rejected branch leaves branch "", which would mean the default branch (watch) or every branch
  # (unwatch), so the whole command is refused rather than run on another branch than the one named.
  - id: route
    type: decision
    next:
      - when: "(verb == 'watch' || verb == 'unwatch') && (branchInvalid || repositories == null || repositories.length == 0)"
        next: reply-errors
      - when: "verb == 'watch'"
        next: watch-each
      - when: "verb == 'unwatch'"
        next: unwatch-each
      - when: "verb == 'list'"
        next: list-grants
      - else: help

  # Sequential, so replies keep the order the user typed and the grant limit is counted one at a time.
  - id: watch-each
    type: for-each
    collection: "= repositories"
    itemVariable: target
    parallel: false
    continueOnError: true
    orchestrationName: grant-watch
    inputs:
      host: "= target.host"
      owner: "= target.owner"
      repo: "= target.repo"
      branch: "= branch"
    resultsVariable: perRepo
    next: reply-each

  - id: unwatch-each
    type: for-each
    collection: "= repositories"
    itemVariable: target
    parallel: false
    continueOnError: true
    orchestrationName: revoke-watch
    inputs:
      host: "= target.host"
      owner: "= target.owner"
      repo: "= target.repo"
      remoteUrl: "= target.remoteUrl"
      branch: "= branch"
    resultsVariable: perRepo
    next: reply-each

  - id: reply-each
    type: activity:JavaScript
    inputs:
      script: |
        var lines = [];
        (perRepo || []).forEach(function (r, i) {
          var target = (repositories || [])[i] || {};
          var name = String(target.owner || '') + '/' + String(target.repo || '');
          if (r && r.message) {
            lines.push(String(r.message));
          } else {
            lines.push('Something went wrong with ' + name + '; nothing was changed for it. Try again later.');
          }
        });
        (errors || []).forEach(function (e) { lines.push(String(e)); });
        lines.join('\n');
    outputs:
      result: agentResponse
    next: compose-reply

  - id: reply-errors
    type: activity:JavaScript
    inputs:
      script: |
        var lines = (errors || []).map(function (e) { return String(e); });
        if (lines.length === 0) {
          lines.push('Name a repository, for example "watch owner/repo on main".');
        }
        if (branchInvalid) {
          lines.push('Nothing was changed.');
        }
        lines.join('\n');
    outputs:
      result: agentResponse
    next: compose-reply

  - id: list-grants
    name: GET /control/grants/self
    type: activity:HttpRequest
    inputs:
      connectionId: sextant-control
      method: GET
      url: /control/grants/self
      failOnErrorStatus: false
    outputs:
      statusCode: grantsStatus
      json: grantsJson
    next: route-list
    on-error: list-unavailable

  - id: route-list
    type: decision
    next:
      - when: "grantsStatus == 200 && grantsJson != null"
        next: list-reply
      - else: list-unavailable

  - id: list-reply
    type: activity:JavaScript
    inputs:
      script: |
        function display(url) {
          var s = String(url || '').trim().replace(/\/+$/, '').replace(/\.git$/i, '');
          var m = /^https:\/\/([^\/]+)\/([^\/]+)\/([^\/]+)$/i.exec(s);
          if (!m) return s;
          return m[1].toLowerCase() === 'github.com' ? m[2] + '/' + m[3] : m[1] + '/' + m[2] + '/' + m[3];
        }
        var states = {
          complete: 'indexed',
          partial: 'partly indexed',
          pending: 'indexing',
          missing: 'not indexed yet'
        };
        var grants = grantsJson.grants || [];
        var text;
        if (grants.length === 0) {
          text = 'You are not watching any repositories yet. Try "watch owner/repo on main".';
        } else {
          var lines = ['You are watching ' + grants.length + (grants.length === 1 ? ' repository:' : ' repositories:')];
          grants.forEach(function (g) {
            var status = g.status || {};
            var branchLabel = g.branch ? String(g.branch)
              : (status.resolved_branch ? String(status.resolved_branch) + ' (default)' : 'the default branch');
            var line = '- ' + display(g.repository) + ' on ' + branchLabel + ': '
              + (states[status.snapshot_status] || 'unknown');
            var sha = String(status.commit_sha || '');
            if (/^[0-9a-f]{7,64}$/i.test(sha)) line += ' at ' + sha.substring(0, 7);
            lines.push(line);
          });
          text = lines.join('\n');
        }
        text;
    outputs:
      result: agentResponse
    next: compose-reply

  - id: list-unavailable
    type: activity:SetVariable
    inputs:
      value: "I couldn't read your watched repositories from the Sextant service right now. Try again later."
    outputs:
      result: agentResponse
    next: log-list

  - id: log-list
    type: activity:Log
    inputs:
      level: Warning
      message: "= 'Sextant list: GET /control/grants/self failed: HTTP ' + grantsStatus"
    next: compose-reply

  - id: help
    type: activity:SetVariable
    inputs:
      value: >
        = 'I can manage the repositories you watch for Sextant indexing. Try: '
          + '"watch owner/repo on main", "stop watching owner/repo", or "what am I watching".'
    outputs:
      result: agentResponse
    next: compose-reply

  - id: refuse-slack
    type: activity:SetVariable
    inputs:
      value: "Watch management isn't enabled for this channel; use the web chat or CLI."
    outputs:
      result: agentResponse
    next: compose-reply

  # The import's note, when there is one, goes before the reply to the command.
  - id: compose-reply
    type: activity:JavaScript
    inputs:
      script: |
        var note = String(importNote || '');
        var reply = String(agentResponse || '');
        note === '' ? reply : note + '\n\n' + reply;
    outputs:
      result: agentResponse
    next: send-reply

  - id: send-reply
    type: activity:SendConnectionMessage
    inputs:
      message: "= agentResponse"
    next: end

  - id: end
    type: end
