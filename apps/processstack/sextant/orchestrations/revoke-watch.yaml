name: revoke-watch
description: >
  Stops watching one repository for the calling user (one iteration of the chat's unwatch command).
  DELETE /control/grants/self removes the caller's own grants (branch "*" when no branch was named, so every
  watched branch of the repository goes), then the v1 watched-repos memory entries are tombstoned
  (legacy-dual-write). Snapshots are left in place; retention reclaims them once nothing points at them.
  An orchestration so that a network failure routes to a reply instead of failing the chat turn.

inputs:
  - name: host
    type: string
    required: true
  - name: owner
    type: string
    required: true
  - name: repo
    type: string
    required: true
  - name: remoteUrl
    type: string
    required: true
    description: The repository URL as the user spelled it; the service keys grants on its canonical form
  - name: branch
    type: string
    required: false
    default: ""
    description: The branch to stop watching; empty for every watched branch

variables:
  - name: branchQuery
    type: string
    default: ""
  - name: deleteStatus
    type: int
    default: 0
  - name: deleteJson
    type: json
  - name: deleted
    type: int
    default: 0
  - name: tombstoned
    type: int
    default: 0
  - name: memoryKeys
    type: string
    default: ""
  - name: message
    type: string
    default: ""

outputs:
  - name: message
    type: string
    description: The reply line for this repository
  - name: branchQuery
    type: string
    description: The branch sent to DELETE /control/grants/self ("*" for every branch)
  - name: deleted
    type: int
    description: The number of grants the service removed
  - name: tombstoned
    type: int
    description: The number of legacy memory entries tombstoned
  - name: memoryKeys
    type: string
    description: The legacy memory keys tombstoned, comma-separated

nodes:
  - id: start
    type: start
    next: set-branch-query

  - id: set-branch-query
    type: activity:SetVariable
    inputs:
      value: "= branch != '' ? branch : '*'"
    outputs:
      result: branchQuery
    next: delete-grants

  - id: delete-grants
    name: DELETE /control/grants/self
    type: activity:HttpRequest
    inputs:
      connectionId: sextant-control
      method: DELETE
      url: /control/grants/self
      query:
        repository: "= remoteUrl"
        branch: "= branchQuery"
      failOnErrorStatus: false
    outputs:
      statusCode: deleteStatus
      json: deleteJson
    next: route-delete
    on-error: refuse-unavailable

  - id: route-delete
    type: decision
    next:
      - when: "deleteStatus == 200"
        next: read-deleted
      - when: "deleteStatus == 400"
        next: refuse-rejected
      - when: "deleteStatus == 401 || deleteStatus == 403"
        next: refuse-denied
      - else: refuse-unavailable

  - id: read-deleted
    type: activity:SetVariable
    inputs:
      value: "= deleteJson != null && typeof deleteJson.deleted === 'number' ? deleteJson.deleted : 0"
    outputs:
      result: deleted
    next: remove-memory

  - id: remove-memory
    type: process:legacy-dual-write
    inputs:
      operation: remove
      host: "= host"
      owner: "= owner"
      repo: "= repo"
      branch: "= branchQuery"
    outputs:
      count: tombstoned
      keys: memoryKeys
    next: reply
    on-error: log-memory

  - id: log-memory
    type: activity:Log
    inputs:
      level: Warning
      message: "Sextant unwatch: the legacy watched-repos memory write failed"
    next: reply

  - id: reply
    type: activity:SetVariable
    inputs:
      value: >
        = (deleted > 0 || tombstoned > 0)
          ? ('Stopped watching ' + owner + '/' + repo + (branch != '' ? (' on ' + branch) : '')
              + '. Existing snapshots are left in place.')
          : ('You were not watching ' + owner + '/' + repo + (branch != '' ? (' on ' + branch) : '') + '.')
    outputs:
      result: message
    next: end

  - id: refuse-rejected
    type: activity:SetVariable
    inputs:
      value: >
        = 'The Sextant service would not stop watching ' + owner + '/' + repo + ' ('
          + (deleteJson != null && /^[a-z0-9_]{1,64}$/.test(String(deleteJson.reason || '')) ? deleteJson.reason : 'rejected')
          + ').'
    outputs:
      result: message
    next: end

  - id: refuse-denied
    type: activity:SetVariable
    inputs:
      value: "= 'The Sextant service refused to stop watching ' + owner + '/' + repo + '.'"
    outputs:
      result: message
    next: log-denied

  - id: log-denied
    type: activity:Log
    inputs:
      level: Warning
      message: "= 'Sextant unwatch: DELETE /control/grants/self was refused: HTTP ' + deleteStatus"
    next: end

  - id: refuse-unavailable
    type: activity:SetVariable
    inputs:
      value: "= 'The Sextant service is unavailable right now, so ' + owner + '/' + repo + ' is still watched. Try again later.'"
    outputs:
      result: message
    next: log-unavailable

  - id: log-unavailable
    type: activity:Log
    inputs:
      level: Warning
      message: "= 'Sextant unwatch: DELETE /control/grants/self failed: HTTP ' + deleteStatus"
    next: end

  - id: end
    type: end
