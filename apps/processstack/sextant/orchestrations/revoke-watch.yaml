name: revoke-watch
description: >
  Stops watching one repository for the calling user (one iteration of the chat's unwatch command).
  DELETE /control/grants/self removes the caller's own grants (branch "*" when no branch was named, so every
  watched branch of the repository goes). A default-branch watch is held with branch "" and the service
  resolves its name, so with a named branch the caller's grant listing is read too, and a default-branch
  grant that resolves to that name is removed as well. When that grant's branch is not resolved yet (the
  repository has no default in the catalog), GitHub's default branch decides it. The v1 watched-repos memory
  entries are tombstoned (legacy-dual-write) once the service is known to hold no watch on what was named,
  including a v1 entry the service never had. They are kept when that is not known (the listing failed, or
  an unresolved default-branch grant GitHub could not name), so the v1 copy never drops a watch the service
  still holds.
  Snapshots are left in place; retention reclaims them once nothing points at them.
  An orchestration so that a network failure routes to a reply instead of failing the chat turn.

inputs:
  - name: host
    type: string
    required: true
  - name: owner
    type: string
    required: true
  - name: repo
    type: string
    required: true
  - name: remoteUrl
    type: string
    required: true
    description: The repository URL as the user spelled it; the service keys grants on its canonical form
  - name: branch
    type: string
    required: false
    default: ""
    description: The branch to stop watching; empty for every watched branch

variables:
  - name: branchQuery
    type: string
    default: ""
  - name: deleteStatus
    type: int
    default: 0
  - name: deleteJson
    type: json
  - name: deleted
    type: int
    default: 0
  - name: listStatus
    type: int
    default: 0
  - name: listJson
    type: json
  - name: defaultState
    type: string
    default: ""
  - name: githubDefault
    type: string
    default: ""
  - name: serviceClear
    type: bool
    default: false
  - name: tombstoned
    type: int
    default: 0
  - name: memoryKeys
    type: string
    default: ""
  - name: message
    type: string
    default: ""

outputs:
  - name: message
    type: string
    description: The reply line for this repository
  - name: branchQuery
    type: string
    description: The branch sent to DELETE /control/grants/self ("*" for every branch)
  - name: deleted
    type: int
    description: The number of grants the service removed
  - name: tombstoned
    type: int
    description: The number of legacy memory entries tombstoned
  - name: memoryKeys
    type: string
    description: The legacy memory keys tombstoned, comma-separated

nodes:
  - id: start
    type: start
    next: init

  # A run seeds variables from undeclared inputs, and a default only fills an unset name
  # (elevenworks/ProcessStack#3286; internal is not enforced on a direct run, #3287). Every variable and
  # output is assigned here before anything reads it.
  - id: init
    name: Reset every variable and output
    type: activity:JavaScript
    inputs:
      script: |
        ['branchQuery', 'defaultState', 'githubDefault', 'memoryKeys', 'message'].forEach(function (name) {
          context.setVariable(name, '');
        });
        ['deleteStatus', 'deleted', 'listStatus', 'tombstoned'].forEach(function (name) {
          context.setVariable(name, 0);
        });
        context.setVariable('deleteJson', null);
        context.setVariable('listJson', null);
        context.setVariable('serviceClear', false);
        null;
    next: set-branch-query

  - id: set-branch-query
    type: activity:SetVariable
    inputs:
      value: "= branch != '' ? branch : '*'"
    outputs:
      result: branchQuery
    next: delete-grants

  - id: delete-grants
    name: DELETE /control/grants/self
    type: activity:HttpRequest
    inputs:
      connectionId: sextant-control
      method: DELETE
      url: /control/grants/self
      query:
        repository: "= remoteUrl"
        branch: "= branchQuery"
      failOnErrorStatus: false
    outputs:
      statusCode: deleteStatus
      json: deleteJson
    next: route-delete
    on-error: refuse-unavailable

  - id: route-delete
    type: decision
    next:
      - when: "deleteStatus == 200"
        next: read-deleted
      - when: "deleteStatus == 400"
        next: refuse-rejected
      - when: "deleteStatus == 401 || deleteStatus == 403"
        next: refuse-denied
      - else: refuse-unavailable

  - id: read-deleted
    type: activity:SetVariable
    inputs:
      value: "= deleteJson != null && typeof deleteJson.deleted === 'number' ? deleteJson.deleted : 0"
    outputs:
      result: deleted
    next: route-named

  # "stop watching X on main" must also end a default-branch watch whose default branch is main: that grant
  # has branch "", which a DELETE with branch=main does not match. Without a branch, branch=* answered 200,
  # so the caller holds no grant for the repository at all.
  - id: route-named
    type: decision
    next:
      - when: "branch != ''"
        next: list-own
      - else: mark-clear

  - id: list-own
    name: GET /control/grants/self
    type: activity:HttpRequest
    inputs:
      connectionId: sextant-control
      method: GET
      url: /control/grants/self
      failOnErrorStatus: false
    outputs:
      statusCode: listStatus
      json: listJson
    next: route-list
    on-error: route-list-failed

  - id: route-list
    type: decision
    next:
      - when: "listStatus == 200"
        next: find-default
      - else: route-list-failed

  # Without the listing, a default-branch watch may remain, so the v1 entries are kept: report the named
  # grant's removal if there was one, else that the service is unavailable.
  - id: route-list-failed
    type: decision
    next:
      - when: "deleted > 0"
        next: reply
      - else: refuse-unavailable

  # match: a default-branch grant resolves to the named branch; unknown: one exists whose branch the service
  # has not resolved yet (it may be the named one); none: no default-branch grant for the repository.
  - id: find-default
    type: activity:SetVariable
    inputs:
      value: >
        = (function () {
            function key(url) {
              return String(url || '').trim().replace(/\/+$/, '').replace(/\.git$/i, '').toLowerCase();
            }
            var wanted = key(remoteUrl);
            var state = 'none';
            ((listJson && listJson.grants) || []).forEach(function (g) {
              if (!g || g.branch !== '' || key(g.repository) !== wanted) return;
              var resolved = g.status && typeof g.status.resolved_branch === 'string' ? g.status.resolved_branch : '';
              if (resolved === branch) state = 'match';
              else if (resolved === '' && state === 'none') state = 'unknown';
            });
            return state;
          })()
    outputs:
      result: defaultState
    next: route-default

  - id: route-default
    type: decision
    next:
      - when: "defaultState == 'match'"
        next: delete-default
      - when: "defaultState == 'none'"
        next: mark-clear
      - when: "host == 'github.com'"
        next: get-default-name
      - else: route-unresolved

  # The service has no default for the repository yet; the application ensure that sets one takes GitHub's
  # default branch, so GitHub answers which branch the unresolved grant is.
  - id: get-default-name
    name: Read the default branch from GitHub
    type: activity:GitHubGetRepository
    inputs:
      connectionId: github
      owner: "= owner"
      repo: "= repo"
    outputs:
      defaultBranch: githubDefault
    next: route-github-default
    on-error: route-unresolved

  - id: route-github-default
    type: decision
    next:
      - when: "githubDefault != '' && githubDefault == branch"
        next: delete-default
      - when: "githubDefault != ''"
        next: mark-clear
      - else: route-unresolved

  - id: route-unresolved
    type: decision
    next:
      - when: "deleted > 0"
        next: reply
      - else: reply-unresolved-default

  - id: reply-unresolved-default
    type: activity:SetVariable
    inputs:
      value: >
        = 'You are watching the default branch of ' + owner + '/' + repo + ', which may be ' + branch
          + ". I couldn't check which branch that is, so it is still watched. Try again later, or say \"stop watching "
          + owner + '/' + repo + '", which stops every branch of ' + owner + '/' + repo + ' you watch.'
    outputs:
      result: message
    next: end

  # No branch parameter: the service reads that as the default branch ("").
  - id: delete-default
    name: DELETE /control/grants/self (default branch)
    type: activity:HttpRequest
    inputs:
      connectionId: sextant-control
      method: DELETE
      url: /control/grants/self
      query:
        repository: "= remoteUrl"
      failOnErrorStatus: false
    outputs:
      statusCode: deleteStatus
      json: deleteJson
    next: route-delete-default
    on-error: route-list-failed

  - id: route-delete-default
    type: decision
    next:
      - when: "deleteStatus == 200"
        next: read-deleted-default
      - else: route-list-failed

  - id: read-deleted-default
    type: activity:SetVariable
    inputs:
      value: "= deleted + (deleteJson != null && typeof deleteJson.deleted === 'number' ? deleteJson.deleted : 0)"
    outputs:
      result: deleted
    next: mark-clear

  - id: mark-clear
    type: activity:SetVariable
    inputs:
      value: true
    outputs:
      result: serviceClear
    next: route-memory

  # The v1 copy mirrors the service: its entries are tombstoned only once the service holds no watch on
  # what was named.
  - id: route-memory
    type: decision
    next:
      - when: "serviceClear"
        next: remove-memory
      - else: reply

  - id: remove-memory
    type: process:legacy-dual-write
    inputs:
      operation: remove
      host: "= host"
      owner: "= owner"
      repo: "= repo"
      branch: "= branchQuery"
    outputs:
      count: tombstoned
      keys: memoryKeys
    next: reply
    on-error: log-memory

  - id: log-memory
    type: activity:Log
    inputs:
      level: Warning
      message: "Sextant unwatch: the legacy watched-repos memory write failed"
    next: reply

  - id: reply
    type: activity:SetVariable
    inputs:
      value: >
        = deleted > 0 || tombstoned > 0
          ? ('Stopped watching ' + owner + '/' + repo + (branch != '' ? (' on ' + branch) : '')
              + '. Existing snapshots are left in place.')
          : ('You were not watching ' + owner + '/' + repo + (branch != '' ? (' on ' + branch) : '') + '.')
    outputs:
      result: message
    next: end

  - id: refuse-rejected
    type: activity:SetVariable
    inputs:
      value: >
        = 'The Sextant service would not stop watching ' + owner + '/' + repo + ' ('
          + (deleteJson != null && /^[a-z0-9_]{1,64}$/.test(String(deleteJson.reason || '')) ? deleteJson.reason : 'rejected')
          + ').'
    outputs:
      result: message
    next: end

  - id: refuse-denied
    type: activity:SetVariable
    inputs:
      value: "= 'The Sextant service refused to stop watching ' + owner + '/' + repo + '.'"
    outputs:
      result: message
    next: log-denied

  - id: log-denied
    type: activity:Log
    inputs:
      level: Warning
      message: "= 'Sextant unwatch: DELETE /control/grants/self was refused: HTTP ' + deleteStatus"
    next: end

  - id: refuse-unavailable
    type: activity:SetVariable
    inputs:
      value: "= 'The Sextant service is unavailable right now, so ' + owner + '/' + repo + ' is still watched. Try again later.'"
    outputs:
      result: message
    next: log-unavailable

  - id: log-unavailable
    type: activity:Log
    inputs:
      level: Warning
      message: "= 'Sextant unwatch: DELETE /control/grants/self failed: HTTP ' + deleteStatus"
    next: end

  - id: end
    type: end
