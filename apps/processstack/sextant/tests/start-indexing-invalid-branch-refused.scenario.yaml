name: start-indexing-invalid-branch-refused
description: >
  start-indexing checks branchName with the chat parser's rule (a leading refs/heads/ is dropped, then git
  check-ref-format --branch, through SextantNormalizeRepository). An invalid name is refused before any
  GitHub or service call.
entrypoint: start-indexing
principal:
  userId: u-alice
inputs:
  repositoryRemoteUrl: "https://github.com/octocat/hello-world.git"
  commitSha: "7fd1a60b01f91b314f59955a4e4d4e80d8edf11d"
  branchName: "feature..x"
http:
  - connection: sextant-control
    method: POST
    path: /control/ensure
    status: 202
    body: { job_id: 42, identity_hash: "9b1d", status: queued, attached: false }
expected:
  status: Completed
  variables:
    outcome: rejected
    reason: invalid_branch
    message: "branchName is not a valid branch name."
  httpCalls:
    - connection: github
      method: GET
      path: /repos/octocat/hello-world
      count: 0
    - connection: sextant-control
      method: GET
      path: /control/resolve
      count: 0
    - connection: sextant-control
      method: POST
      path: /control/ensure
      count: 0
