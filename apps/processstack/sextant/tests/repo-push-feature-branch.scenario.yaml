name: repo-push-feature-branch
description: >
  (#14) A push to another branch records the tenant grant and advances that branch under the CAS of
  `before`, with default_branch false (it never claims the default). A forced push says so for the audit.
  Only the default branch has a v1 enrolled row, so none is written.
entrypoint: on-repository-change
event:
  event: push
  owner: octocat
  repo: hello-world
  connectionId: conn-1
  cloneUrl: "https://github.com/octocat/hello-world.git"
  defaultBranch: main
  ref: refs/heads/feature/x
  refType: branch
  branch: feature/x
  before: "553c2077f0edc3d5dc5d17262f6aa498e69d6f8e"
  after: "b3cbd5bbd7e81436d2eee04537ea2b4c0cad4cdf"
  forced: "true"
  created: "false"
  deleted: "false"
http:
  - connection: sextant-control
    method: PUT
    path: /control/grants/tenant
    body:
      grant: { repository: "https://github.com/octocat/hello-world.git", branch: "", source: tenant, created_at: 1760000000 }
      created: false
  - connection: sextant-control
    method: POST
    path: /control/ensure
    body: { job_id: 43, identity_hash: "9b1e", status: running, attached: true }
expected:
  status: Completed
  variables:
    action: ensure
    grantOutcome: granted
    ensureOutcome: attached
    enrollment: ""
    enrolledKey: ""
    enrolledValue: ""
  httpCalls:
    - connection: sextant-control
      method: PUT
      path: /control/grants/tenant
      count: 1
    - connection: sextant-control
      method: POST
      path: /control/ensure
      bodyMatch:
        repository_remote_url: "https://github.com/octocat/hello-world.git"
        commit_sha: "b3cbd5bbd7e81436d2eee04537ea2b4c0cad4cdf"
        branch_name: feature/x
        branch_update: advance
        expected_head_commit: "553c2077f0edc3d5dc5d17262f6aa498e69d6f8e"
        default_branch: false
        forced: true
      count: 1
