name: repo-push-default-branch
description: >
  (#13, #33) A push to the default branch records the tenant grant, then advances the branch under the
  compare-and-swap of the push's `before`, claiming the default (default_branch true), and upserts the v1
  enrolled row in App State. The run carries no user caller: the sender's login (here a user id) is never
  identity.
entrypoint: on-repository-change
# The normalized GitHub push fields (PS-5); every value is a string.
event:
  event: push
  action: ""
  owner: octocat
  repo: hello-world
  connectionId: conn-1
  installationId: "1001"
  deliveryId: delivery-1
  senderLogin: u-alice
  cloneUrl: "https://github.com/octocat/hello-world.git"
  htmlUrl: "https://github.com/octocat/hello-world"
  defaultBranch: main
  private: "false"
  ref: refs/heads/main
  refType: branch
  branch: main
  before: "553c2077f0edc3d5dc5d17262f6aa498e69d6f8e"
  after: "7fd1a60b01f91b314f59955a4e4d4e80d8edf11d"
  forced: "false"
  created: "false"
  deleted: "false"
  commitCount: "1"
http:
  # Shape: PUT /control/grants/tenant → {grant, created} (src/Sextant.Service.Host/GrantEndpoints.cs,
  # src/Sextant.Service/Grants/GrantContracts.cs).
  - connection: sextant-control
    method: PUT
    path: /control/grants/tenant
    body:
      grant: { repository: "https://github.com/octocat/hello-world.git", branch: "", source: tenant, created_at: 1760000000 }
      created: true
  # Shape: POST /control/ensure?wait=false → 202 EnsureSnapshotResult (src/Sextant.Service/ServiceContracts.cs).
  - connection: sextant-control
    method: POST
    path: /control/ensure
    status: 202
    body: { job_id: 42, identity_hash: "9b1d", status: queued, attached: false }
expected:
  status: Completed
  variables:
    action: ensure
    reason: ""
    grantOutcome: granted
    ensureOutcome: ok
    ensureReason: ""
    enrollment: recorded
    enrolledKey: "enrolled/conn-1/github.com/octocat/hello-world@main"
    enrolledValue: '!contains:"CloneUrl":"https://github.com/octocat/hello-world.git"'
    retireOutcome: ""
  httpCalls:
    - connection: sextant-control
      method: PUT
      path: /control/grants/tenant
      caller: { act: "!absent" }
      bodyMatch:
        repository: "https://github.com/octocat/hello-world.git"
      count: 1
    - connection: sextant-control
      method: POST
      path: /control/ensure
      caller: { act: "!absent" }
      bodyMatch:
        repository_remote_url: "https://github.com/octocat/hello-world.git"
        commit_sha: "7fd1a60b01f91b314f59955a4e4d4e80d8edf11d"
        branch_name: main
        branch_update: advance
        expected_head_commit: "553c2077f0edc3d5dc5d17262f6aa498e69d6f8e"
        default_branch: true
        forced: false
      count: 1
    - connection: github
      path: "/repos/**"
      count: 0
