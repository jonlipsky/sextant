name: slack-watch-refused
description: >
  (#32) On Slack the caller is a Slack peer (idp=slack), not a platform user, so watch management is refused
  before the command is parsed: the reply says so and no service call is made.
entrypoint: configure-watched-repos
principal:
  userId: u-alice
inputs:
  # The prompt-trigger envelope `app test` needs to route SendConnectionMessage (the platform sets these).
  tenantId: "sextant-test"
  applicationInstanceId: "sextant-test-instance"
  conversationId: "conv-slack-watch-refused"
  prompt: "watch octocat/hello-world on main"
  isFirstTurn: true
  channelType: "slack"
# Answers anything, so the harness records every request and `count: 0` proves none was made.
http:
  - path: "/**"
    status: 500
    body: { error: unexpected }
expected:
  status: Completed
  variables:
    agentResponse: "Watch management isn't enabled for this channel; use the web chat or CLI."
    verb: ""
  httpCalls:
    - count: 0
