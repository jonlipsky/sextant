name: unwatch-default-unresolved-keeps-v1
description: >
  "stop watching X on main" while the caller's only grant is a default-branch watch whose branch the
  service has not resolved yet (no resolved_branch: the repository has no default in the catalog). It may
  be main, so nothing more is deleted, the v1 entry is kept, and the reply says how to stop the watch.
entrypoint: revoke-watch
principal:
  userId: u-alice
inputs:
  host: github.com
  owner: octocat
  repo: hello-world
  remoteUrl: "https://github.com/octocat/hello-world.git"
  branch: main
seed:
  userMemory:
    - key: "sextant.watched-repos:github.com/octocat/hello-world@main"
      value: '{"owner":"octocat","repo":"hello-world","branch":"main","cloneUrl":"https://github.com/octocat/hello-world.git","addedAt":"2026-01-01T00:00:00+00:00"}'
# Shape: GrantStatus (src/Sextant.Service/Grants/GrantContracts.cs); a null resolved_branch is omitted.
http:
  - connection: sextant-control
    method: DELETE
    path: /control/grants/self
    body: { deleted: 0 }
  - connection: sextant-control
    method: GET
    path: /control/grants/self
    body:
      grants:
        - repository: "https://github.com/octocat/hello-world.git"
          branch: ""
          source: self
          created_at: 1767225600
          status: { snapshot_status: missing }
      result_count: 1
expected:
  status: Completed
  variables:
    deleted: 0
    tombstoned: 0
    defaultState: unknown
    message: "You are watching the default branch of octocat/hello-world, which may be main. To stop watching it, say \"stop watching octocat/hello-world\"."
  httpCalls:
    - connection: sextant-control
      method: DELETE
      path: /control/grants/self
      count: 1
