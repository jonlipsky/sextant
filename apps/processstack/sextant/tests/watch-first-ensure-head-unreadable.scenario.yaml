name: watch-first-ensure-head-unreadable
description: >
  The grant is recorded and the branch has no snapshot, but GitHub's branch listing fails (500): the watch
  stands, no ensure is sent, and the reply says indexing starts with the next push (not that the branch has
  no commits).
entrypoint: grant-watch
principal:
  userId: u-alice
inputs:
  host: github.com
  owner: octocat
  repo: hello-world
http:
  # Shape: GitHub REST GET /repos/{owner}/{repo} (read by GitHubGetRepository through Octokit).
  - connection: github
    method: GET
    path: /repos/octocat/hello-world
    body:
      id: 1296269
      name: hello-world
      full_name: octocat/hello-world
      owner: { login: octocat, id: 1 }
      private: false
      default_branch: main
      html_url: "https://github.com/octocat/hello-world"
      clone_url: "https://github.com/octocat/hello-world.git"
  - connection: github
    method: GET
    path: /repos/octocat/hello-world/branches
    status: 500
    body: { message: "Server Error" }
  - connection: sextant-control
    method: PUT
    path: /control/grants/self
    body:
      grant: { repository: "https://github.com/octocat/hello-world.git", branch: "", source: self, created_at: 1760000000 }
      created: true
  - connection: sextant-control
    method: GET
    path: /control/grants/self
    body:
      grants:
        - repository: "https://github.com/octocat/hello-world.git"
          branch: ""
          source: self
          created_at: 1760000000
          status: { resolved_branch: main, snapshot_status: missing }
      result_count: 1
expected:
  status: Completed
  variables:
    granted: true
    needsIndex: true
    ensureOutcome: unavailable
    message: "Now watching octocat/hello-world on main (the default branch). Indexing could not start yet; it will start with the next push."
  httpCalls:
    - connection: github
      method: GET
      path: /repos/octocat/hello-world/branches
      count: 1
    - connection: sextant-control
      method: POST
      path: /control/ensure
      count: 0
