name: ensure-advance-other-host-sends-none
description: >
  The GitHub connection answers for github.com only, so the head of a branch on another host cannot be
  confirmed: an advance there is sent with branch_update "none", without reading GitHub. The service's own
  host policy still decides whether the repository is accepted at all.
entrypoint: ensure
principal:
  userId: u-alice
inputs:
  repositoryRemoteUrl: "https://gitlab.com/octocat/hello-world.git"
  commitSha: "7fd1a60b01f91b314f59955a4e4d4e80d8edf11d"
  branchName: main
  branchUpdate: advance
  expectedHeadCommit: ""
http:
  - connection: github
    path: "/repos/**"
    status: 500
  - connection: sextant-control
    method: POST
    path: /control/ensure
    status: 400
    body: { status: rejected, reason: host_not_allowed }
expected:
  status: Completed
  variables:
    outcome: rejected
    reason: host_not_allowed
    wantsAdvance: false
    effectiveUpdate: none
  httpCalls:
    - path: "/repos/**"
      count: 0
    - connection: sextant-control
      method: POST
      path: /control/ensure
      bodyMatch:
        repository_remote_url: "https://gitlab.com/octocat/hello-world.git"
        branch_name: main
        branch_update: none
        expected_head_commit: null
      count: 1
