name: get-indexing-status-not-found
description: >
  (#30) An unknown job, or one on a repository the caller cannot read, is the same 404: found is false.
entrypoint: get-indexing-status
principal:
  userId: u-alice
inputs:
  jobId: "43"
http:
  - connection: sextant-control
    method: GET
    path: /control/status/43
    status: 404
expected:
  status: Completed
  variables:
    found: false
    indexingState: ""
    outcome: not_found
  httpCalls:
    - connection: sextant-control
      method: GET
      path: /control/status/43
      count: 1
