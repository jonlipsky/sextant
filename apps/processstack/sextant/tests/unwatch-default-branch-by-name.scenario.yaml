name: unwatch-default-branch-by-name
description: >
  "stop watching X on main" where main is X's default branch: the watch is held with branch "", so the
  DELETE for branch main removes nothing. The caller's grant listing shows the default-branch grant
  resolving to main, which is then removed (DELETE without a branch), and the v1 entry is tombstoned.
entrypoint: revoke-watch
principal:
  userId: u-alice
inputs:
  host: github.com
  owner: octocat
  repo: hello-world
  remoteUrl: "https://github.com/octocat/hello-world.git"
  branch: main
seed:
  userMemory:
    - key: "sextant.watched-repos:github.com/octocat/hello-world@main"
      value: '{"owner":"octocat","repo":"hello-world","branch":"main","cloneUrl":"https://github.com/octocat/hello-world.git","addedAt":"2026-01-01T00:00:00+00:00"}'
# Shapes: DELETE → {deleted: N}; GET → {grants: [GrantView], result_count} (src/Sextant.Service.Host/GrantEndpoints.cs,
# src/Sextant.Service/Grants/GrantContracts.cs). The first DELETE (branch=main) answers once; the second (no branch) removes the grant.
http:
  - connection: sextant-control
    method: DELETE
    path: /control/grants/self
    times: 1
    body: { deleted: 0 }
  - connection: sextant-control
    method: GET
    path: /control/grants/self
    body:
      grants:
        - repository: "https://github.com/octocat/hello-world.git"
          branch: ""
          source: self
          created_at: 1767225600
          status: { resolved_branch: main, snapshot_status: complete, commit_sha: "7fd1a60b01f91b314f59955a4e4d4e80d8edf11d" }
      result_count: 1
  - connection: sextant-control
    method: DELETE
    path: /control/grants/self
    body: { deleted: 1 }
expected:
  status: Completed
  variables:
    deleted: 1
    tombstoned: 1
    memoryKeys: "github.com/octocat/hello-world@main"
    message: "Stopped watching octocat/hello-world on main. Existing snapshots are left in place."
  httpCalls:
    - connection: sextant-control
      method: DELETE
      path: /control/grants/self
      caller: { act: user, idp: processstack, sub: u-alice }
      count: 2
    - connection: sextant-control
      method: GET
      path: /control/grants/self
      count: 1