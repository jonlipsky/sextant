name: reconcile-sets-default
description: >
  (#199) A user watched the repository first, so the service holds GitHub's default branch at its head but
  not as the repository's default (a user never claims the default). The reconcile, as the application,
  promotes it: an ensure under the compare-and-swap of the commit it already points at (no pointer moves)
  with default_branch true.
entrypoint: reconcile
http:
  - connection: sextant-control
    method: GET
    path: /control/grants
    body:
      targets:
        - { repository: "https://github.com/octocat/hello-world.git", branch: "", sources: [self, tenant], watchers: 2 }
      result_count: 1
  - connection: github
    method: GET
    path: /repos/octocat/hello-world
    body:
      id: 1296269
      name: hello-world
      full_name: octocat/hello-world
      owner: { login: octocat, id: 1 }
      private: false
      default_branch: main
      html_url: "https://github.com/octocat/hello-world"
      clone_url: "https://github.com/octocat/hello-world.git"
  - connection: sextant-control
    method: GET
    path: /control/resolve
    body: { id: 7, status: complete, commit_sha: "7fd1a60b01f91b314f59955a4e4d4e80d8edf11d", branch: main, is_default: false }
  - connection: github
    method: GET
    path: /repos/octocat/hello-world/branches
    body:
      - name: main
        commit: { sha: "7fd1a60b01f91b314f59955a4e4d4e80d8edf11d", url: "https://api.github.com/repos/octocat/hello-world/commits/7fd1a60b01f91b314f59955a4e4d4e80d8edf11d" }
        protected: false
  - connection: sextant-control
    method: POST
    path: /control/ensure
    body: { job_id: 62, identity_hash: "bb03", status: complete, attached: true, branch_advanced: true }
expected:
  status: Completed
  variables:
    status: completed
    targetCount: 1
    upToDate: 0
    ensured: 1
    failed: 0
  httpCalls:
    - connection: sextant-control
      method: POST
      path: /control/ensure
      bodyMatch:
        repository_remote_url: "https://github.com/octocat/hello-world.git"
        commit_sha: "7fd1a60b01f91b314f59955a4e4d4e80d8edf11d"
        branch_name: main
        branch_update: advance
        expected_head_commit: "7fd1a60b01f91b314f59955a4e4d4e80d8edf11d"
        default_branch: true
      count: 1
