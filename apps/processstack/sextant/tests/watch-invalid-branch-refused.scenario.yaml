name: watch-invalid-branch-refused
description: >
  "watch X on" names no branch after "on": the command is refused rather than watching the default branch,
  and no GitHub or service call is made.
entrypoint: configure-watched-repos
principal:
  userId: u-alice
inputs:
  # The prompt-trigger envelope `app test` needs to route SendConnectionMessage (the platform sets these).
  tenantId: "sextant-test"
  applicationInstanceId: "sextant-test-instance"
  conversationId: "conv-watch-invalid-branch"
  prompt: "watch octocat/hello-world on"
  isFirstTurn: false
  channelType: "web"
# Answers anything, so the harness records every request and `count: 0` proves none was made.
http:
  - path: "/**"
    status: 500
    body: { error: unexpected }
expected:
  status: Completed
  variables:
    verb: watch
    branchInvalid: true
    agentResponse: "Name the branch after \"on\".\nNothing was changed."
  httpCalls:
    - count: 0