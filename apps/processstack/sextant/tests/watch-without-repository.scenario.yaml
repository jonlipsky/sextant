name: watch-without-repository
description: >
  "watch" with no repository is answered with the parser's hint; no service call is made.
entrypoint: configure-watched-repos
principal:
  userId: u-alice
inputs:
  # The prompt-trigger envelope `app test` needs to route SendConnectionMessage (the platform sets these).
  tenantId: "sextant-test"
  applicationInstanceId: "sextant-test-instance"
  conversationId: "conv-watch-without-repository"
  prompt: "watch"
  isFirstTurn: false
  channelType: "web"
http:
  - path: "/**"
    status: 500
expected:
  status: Completed
  variables:
    verb: watch
    agentResponse: "Name a repository, for example: watch owner/repo on main."
  httpCalls:
    - count: 0
