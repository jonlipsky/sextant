name: repo-push-grant-limit
description: >
  The tenant is at its grant limit (409 grant_limit). That is still an application answer, so the push
  ensure is sent (the service decides what it indexes), but no enrolled row is written: the row mirrors a
  grant the service did not record.
entrypoint: on-repository-change
event:
  event: push
  owner: octocat
  repo: hello-world
  connectionId: conn-1
  cloneUrl: "https://github.com/octocat/hello-world.git"
  defaultBranch: main
  ref: refs/heads/main
  refType: branch
  branch: main
  before: "553c2077f0edc3d5dc5d17262f6aa498e69d6f8e"
  after: "7fd1a60b01f91b314f59955a4e4d4e80d8edf11d"
  forced: "false"
  deleted: "false"
http:
  - connection: sextant-control
    method: PUT
    path: /control/grants/tenant
    status: 409
    body: { status: rejected, reason: grant_limit }
  - connection: sextant-control
    method: POST
    path: /control/ensure
    status: 202
    body: { job_id: 45, identity_hash: "9b20", status: queued, attached: false }
expected:
  status: Completed
  variables:
    grantOutcome: limit
    ensureOutcome: ok
    enrollment: ""
    enrolledKey: ""
  httpCalls:
    - connection: sextant-control
      method: POST
      path: /control/ensure
      bodyMatch: { branch_update: advance, default_branch: true }
      count: 1
