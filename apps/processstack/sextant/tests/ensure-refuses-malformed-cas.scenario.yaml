name: ensure-refuses-malformed-cas
description: >
  ensure is internal, but the platform does not enforce internal on a direct run (elevenworks/ProcessStack#3287),
  so it validates its own inputs instead of trusting its caller. An advance's expected_head_commit must be ""
  or a full lower-case commit SHA; anything else (a ref name, an abbreviated or upper-case SHA) is refused
  without calling the service.
entrypoint: ensure
principal:
  userId: u-alice
inputs:
  repositoryRemoteUrl: "https://github.com/octocat/hello-world.git"
  commitSha: "7fd1a60b01f91b314f59955a4e4d4e80d8edf11d"
  branchName: main
  branchUpdate: advance
  expectedHeadCommit: "553C2077F0EDC3D5DC5D17262F6AA498E69D6F8E"
http:
  - connection: sextant-control
    method: POST
    path: /control/ensure
    status: 202
    body: { job_id: 42, identity_hash: "9b1d", status: queued, attached: false }
expected:
  status: Completed
  variables:
    outcome: rejected
    reason: invalid_expected_head
    statusCode: 0
    jobId: ""
  httpCalls:
    - connection: sextant-control
      method: POST
      path: /control/ensure
      count: 0
