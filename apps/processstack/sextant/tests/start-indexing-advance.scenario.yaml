name: start-indexing-advance
description: >
  (#27) start-indexing of a branch's current head advances the branch with the compare-and-swap on the
  service's current head (GET /control/resolve → commit_sha).
entrypoint: start-indexing
principal:
  userId: u-alice
inputs:
  repositoryRemoteUrl: "https://github.com/octocat/hello-world.git"
  commitSha: "7fd1a60b01f91b314f59955a4e4d4e80d8edf11d"
  branchName: main
http:
  # Shape: GitHub REST GET /repos/{owner}/{repo}/branches (read by GitHubListBranches through Octokit).
  - connection: github
    method: GET
    path: /repos/octocat/hello-world/branches
    body:
      - name: main
        commit: { sha: "7fd1a60b01f91b314f59955a4e4d4e80d8edf11d", url: "https://api.github.com/repos/octocat/hello-world/commits/7fd1a60b01f91b314f59955a4e4d4e80d8edf11d" }
        protected: false
      - name: feature/x
        commit: { sha: "b3cbd5bbd7e81436d2eee04537ea2b4c0cad4cdf", url: "https://api.github.com/repos/octocat/hello-world/commits/b3cbd5bbd7e81436d2eee04537ea2b4c0cad4cdf" }
        protected: false
  # Shape: GET /control/resolve → the snapshot row plus commit_sha, branch, is_default, head_sequence?
  # (src/Sextant.Service.Host/ServiceApp.cs).
  - connection: sextant-control
    method: GET
    path: /control/resolve
    body:
      id: 6
      identity_hash: "8a0c"
      status: complete
      commit_sha: "553c2077f0edc3d5dc5d17262f6aa498e69d6f8e"
      branch: main
      is_default: true
  - connection: sextant-control
    method: POST
    path: /control/ensure
    status: 202
    body: { job_id: 42, identity_hash: "9b1d", status: queued, attached: false }
expected:
  status: Completed
  variables:
    outcome: ok
    jobId: "42"
    advanceRequested: true
    # A queued job has made no branch decision yet (no branch_advanced), so nothing is said about the branch.
    message: "Indexing job 42 is queued."
  httpCalls:
    - connection: github
      method: GET
      path: /repos/octocat/hello-world/branches
      count: 1
    - connection: sextant-control
      method: POST
      path: /control/ensure
      bodyMatch:
        branch_name: main
        branch_update: advance
        expected_head_commit: "553c2077f0edc3d5dc5d17262f6aa498e69d6f8e"
        default_branch: null
        branch_head_sequence: null
      count: 1
