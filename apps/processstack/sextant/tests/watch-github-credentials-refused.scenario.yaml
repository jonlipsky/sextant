name: watch-github-credentials-refused
description: >
  A GitHub failure that is neither transient nor a 5xx fails closed as "not visible". Here GitHub refuses
  the connection's credential (401, Octokit's AuthorizationException). An App with no installation for the
  owner (an InvalidOperationException before any request, which the scenario harness cannot raise) takes
  the same route. No grant is written.
entrypoint: grant-watch
principal:
  userId: u-alice
inputs:
  host: github.com
  owner: octocat
  repo: hello-world
http:
  - connection: github
    method: GET
    path: /repos/octocat/hello-world
    status: 401
    body: { message: "Bad credentials", documentation_url: "https://docs.github.com/rest" }
  - connection: sextant-control
    path: "/**"
    status: 500
expected:
  status: Completed
  variables:
    granted: false
    message: "octocat/hello-world isn't visible to this workspace's GitHub connection, so I can't watch it."
  httpCalls:
    - connection: github
      method: GET
      path: /repos/octocat/hello-world
      count: 1
    - connection: sextant-control
      count: 0
