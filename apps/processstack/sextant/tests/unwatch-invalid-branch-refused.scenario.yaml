name: unwatch-invalid-branch-refused
description: >
  "stop watching X on bad..name": the branch is rejected, so the whole command is refused. It never falls
  back to branch "" (every branch for an unwatch), and no service call is made.
entrypoint: configure-watched-repos
principal:
  userId: u-alice
inputs:
  # The prompt-trigger envelope `app test` needs to route SendConnectionMessage (the platform sets these).
  tenantId: "sextant-test"
  applicationInstanceId: "sextant-test-instance"
  conversationId: "conv-unwatch-invalid-branch"
  prompt: "stop watching octocat/hello-world on bad..name"
  isFirstTurn: false
  channelType: "web"
# Answers anything, so the harness records every request and `count: 0` proves none was made.
http:
  - path: "/**"
    status: 500
    body: { error: unexpected }
expected:
  status: Completed
  variables:
    verb: unwatch
    branchInvalid: true
    agentResponse: "'bad..name' is not a valid branch name.\nNothing was changed."
  httpCalls:
    - count: 0