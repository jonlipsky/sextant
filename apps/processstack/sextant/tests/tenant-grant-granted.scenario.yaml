name: tenant-grant-granted
description: >
  PUT /control/grants/tenant records the tenant-wide grant (no branch; it covers the default branch). The
  body carries only the repository, sent as given.
entrypoint: tenant-grant
inputs:
  repository: "https://github.com/octocat/hello-world.git"
http:
  - connection: sextant-control
    method: PUT
    path: /control/grants/tenant
    body:
      grant: { repository: "https://github.com/octocat/hello-world.git", branch: "", source: tenant, created_at: 1760000000 }
      created: true
expected:
  status: Completed
  variables:
    outcome: granted
    created: true
    statusCode: 200
    reason: ""
  httpCalls:
    - connection: sextant-control
      method: PUT
      path: /control/grants/tenant
      bodyMatch: { repository: "https://github.com/octocat/hello-world.git", branch: null, principal: null, tenant: null }
      count: 1
