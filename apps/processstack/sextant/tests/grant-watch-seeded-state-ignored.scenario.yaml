name: grant-watch-seeded-state-ignored
description: >
  A run seeds a variable from an undeclared input (elevenworks/ProcessStack#3286), and a refusal path assigns
  only the message. The orchestration resets every variable first, so a seeded granted/needsIndex/ensureOutcome
  never reports a watch that was not written.
entrypoint: grant-watch
principal:
  userId: u-alice
inputs:
  host: github.com
  owner: octocat
  repo: hello-world
  granted: true
  needsIndex: true
  ensureOutcome: ok
  memoryKeys: "seeded"
  memoryValue: "seeded"
http:
  - connection: github
    method: GET
    path: /repos/octocat/hello-world
    status: 404
    body: { message: "Not Found" }
  - connection: sextant-control
    path: "/**"
    status: 500
expected:
  status: Completed
  variables:
    granted: false
    needsIndex: false
    ensureOutcome: ""
    memoryKeys: ""
    memoryValue: ""
    message: "octocat/hello-world isn't visible to this workspace's GitHub connection, so I can't watch it."
  httpCalls:
    - connection: sextant-control
      count: 0
