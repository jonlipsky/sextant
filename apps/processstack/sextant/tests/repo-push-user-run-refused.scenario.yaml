name: repo-push-user-run-refused
description: >
  A user starts on-repository-change directly (the platform does not refuse it, elevenworks/ProcessStack#3287)
  with a forged push event. The run carries the user's caller, so the service refuses the tenant grant
  (403 wrong_actor), and the flow then sends no ensure and writes no enrolled row: the user cannot advance
  a branch past the GitHub head or plant a row the nightly import would grant.
entrypoint: on-repository-change
principal:
  userId: u-mallory
event:
  event: push
  owner: octocat
  repo: hello-world
  connectionId: conn-1
  cloneUrl: "https://github.com/octocat/hello-world.git"
  defaultBranch: main
  ref: refs/heads/main
  refType: branch
  branch: main
  before: "553c2077f0edc3d5dc5d17262f6aa498e69d6f8e"
  after: "6dcb09b5b57875f334f61aebed695e2e4193db5e"
  forced: "true"
  deleted: "false"
http:
  # Shape: 403 {"status":"rejected","reason":"wrong_actor"} (src/Sextant.Service.Host/GrantEndpoints.cs).
  - connection: sextant-control
    method: PUT
    path: /control/grants/tenant
    status: 403
    body: { status: rejected, reason: wrong_actor }
  - connection: sextant-control
    method: POST
    path: /control/ensure
    status: 500
expected:
  status: Completed
  variables:
    action: ensure
    grantOutcome: unauthorized
    ensureOutcome: ""
    enrollment: ""
    enrolledKey: ""
    enrolledValue: ""
  httpCalls:
    - connection: sextant-control
      method: PUT
      path: /control/grants/tenant
      caller: { act: user, sub: u-mallory }
      count: 1
    - connection: sextant-control
      path: /control/ensure
      count: 0
