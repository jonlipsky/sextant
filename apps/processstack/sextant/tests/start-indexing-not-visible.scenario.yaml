name: start-indexing-not-visible
description: >
  A repository the workspace's GitHub connection cannot see (404) is never ensured. A process has no error
  route, so the call fails.
entrypoint: start-indexing
principal:
  userId: u-alice
inputs:
  repositoryRemoteUrl: "https://github.com/octocat/private-repo.git"
  commitSha: "7fd1a60b01f91b314f59955a4e4d4e80d8edf11d"
  branchName: main
http:
  # GitHub answers 404 for a repository the connection cannot see (Octokit raises NotFoundException).
  - connection: github
    method: GET
    path: /repos/octocat/private-repo
    status: 404
    body: { message: "Not Found", documentation_url: "https://docs.github.com/rest/repos/repos#get-a-repository" }
expected:
  status: Failed
  httpCalls:
    - connection: github
      method: GET
      path: /repos/octocat/private-repo
      count: 1
    - connection: sextant-control
      path: "/control/**"
      count: 0
