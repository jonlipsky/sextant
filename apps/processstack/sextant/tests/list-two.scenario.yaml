name: list-two
description: >
  (#9) Two grants render one line each: the repository, the branch (the resolved default when the grant
  names none), the snapshot status and a 7-character commit.
entrypoint: configure-watched-repos
principal:
  userId: u-alice
inputs:
  # The prompt-trigger envelope `app test` needs to route SendConnectionMessage (the platform sets these).
  tenantId: "sextant-test"
  applicationInstanceId: "sextant-test-instance"
  conversationId: "conv-list-two"
  prompt: "list my watched repos"
  isFirstTurn: false
  channelType: "web"
# Shape: GrantListResponse / GrantListEntry / GrantStatusView (src/Sextant.Service/Grants/GrantContracts.cs).
http:
  - connection: sextant-control
    method: GET
    path: /control/grants/self
    body:
      grants:
        - repository: "https://github.com/octocat/hello-world.git"
          branch: ""
          source: self
          created_at: 1760000000
          status:
            resolved_branch: main
            snapshot_status: complete
            commit_sha: "7fd1a60b01f91b314f59955a4e4d4e80d8edf11d"
            published_at: 1760000100
            identity_hash: "0f3c"
        - repository: "https://github.com/octocat/spoon-knife.git"
          branch: "feature/x"
          source: self
          created_at: 1760000200
          status:
            resolved_branch: "feature/x"
            snapshot_status: missing
      result_count: 2
expected:
  status: Completed
  variables:
    verb: list
    agentResponse: "You are watching 2 repositories:\n- octocat/hello-world on main (default): indexed at 7fd1a60\n- octocat/spoon-knife on feature/x: not indexed yet"
  httpCalls:
    - connection: sextant-control
      method: GET
      path: /control/grants/self
      count: 1
