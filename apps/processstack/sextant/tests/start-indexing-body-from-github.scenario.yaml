name: start-indexing-body-from-github
description: >
  (#203 item 1) The ensure body is built from GitHub and the service, never from the tool's arguments. The
  arguments spell the repository https://github.com/OctoCat/Hello-World (no .git) and the commit in upper
  case, and name main. GitHub's own spelling gives repository_remote_url, GitHub's branch head gives
  commit_sha, and the service's head (GET /control/resolve) gives expected_head_commit. Neither argument
  appears in the body as the caller spelled it.
entrypoint: start-indexing
principal:
  userId: u-alice
inputs:
  repositoryRemoteUrl: "https://github.com/OctoCat/Hello-World"
  commitSha: " 7FD1A60B01F91B314F59955A4E4D4E80D8EDF11D "
  branchName: main
http:
  # Shape: GitHub REST GET /repos/{owner}/{repo} (read by GitHubGetRepository through Octokit). GitHub
  # matches owner/repo case-insensitively and answers with its own spelling in full_name.
  - connection: github
    method: GET
    path: /repos/OctoCat/Hello-World
    body:
      id: 1296269
      name: hello-world
      full_name: octocat/hello-world
      owner: { login: octocat, id: 1 }
      private: false
      default_branch: main
      html_url: "https://github.com/octocat/hello-world"
      clone_url: "https://github.com/octocat/hello-world.git"
  # Shape: GitHub REST GET /repos/{owner}/{repo}/branches (read by GitHubListBranches through Octokit).
  - connection: github
    method: GET
    path: /repos/octocat/hello-world/branches
    body:
      - name: main
        commit: { sha: "7fd1a60b01f91b314f59955a4e4d4e80d8edf11d", url: "https://api.github.com/repos/octocat/hello-world/commits/7fd1a60b01f91b314f59955a4e4d4e80d8edf11d" }
        protected: false
  # Shape: GET /control/resolve → the snapshot row plus commit_sha, branch, is_default, head_sequence?
  # (src/Sextant.Service.Host/ServiceApp.cs).
  - connection: sextant-control
    method: GET
    path: /control/resolve
    body:
      id: 6
      identity_hash: "8a0c"
      status: complete
      commit_sha: "553c2077f0edc3d5dc5d17262f6aa498e69d6f8e"
      branch: main
      is_default: true
  # Shape: POST /control/ensure[?wait=false] → EnsureSnapshotResult, 202 while not terminal
  # (src/Sextant.Service.Host/ServiceApp.cs, src/Sextant.Service/ServiceContracts.cs).
  - connection: sextant-control
    method: POST
    path: /control/ensure
    status: 202
    body: { job_id: 42, identity_hash: "9b1d", status: queued, attached: false }
expected:
  status: Completed
  variables:
    outcome: ok
    advanceRequested: true
    remoteUrl: "https://github.com/octocat/hello-world.git"
    githubHead: "7fd1a60b01f91b314f59955a4e4d4e80d8edf11d"
    expectedHead: "553c2077f0edc3d5dc5d17262f6aa498e69d6f8e"
  httpCalls:
    - connection: github
      method: GET
      path: /repos/OctoCat/Hello-World
      count: 1
    - connection: github
      method: GET
      path: /repos/octocat/hello-world/branches
      count: 1
    - connection: sextant-control
      method: POST
      path: /control/ensure
      caller: { act: user, idp: processstack, sub: u-alice }
      bodyMatch:
        repository_remote_url: "https://github.com/octocat/hello-world.git"
        commit_sha: "7fd1a60b01f91b314f59955a4e4d4e80d8edf11d"
        branch_name: main
        branch_update: advance
        expected_head_commit: "553c2077f0edc3d5dc5d17262f6aa498e69d6f8e"
        tree_sha: null
        config_hash: null
        default_branch: null
        branch_head_sequence: null
      count: 1
