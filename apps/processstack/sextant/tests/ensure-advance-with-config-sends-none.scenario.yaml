name: ensure-advance-with-config-sends-none
description: >
  Only the default profile of a branch can move it: an advance that carries a configuration hash is sent
  with branch_update "none", without reading GitHub.
entrypoint: ensure
principal:
  userId: u-alice
inputs:
  repositoryRemoteUrl: "https://github.com/octocat/hello-world.git"
  commitSha: "7fd1a60b01f91b314f59955a4e4d4e80d8edf11d"
  branchName: main
  branchUpdate: advance
  expectedHeadCommit: ""
  configHash: "c0ffee"
http:
  - connection: github
    path: "/repos/**"
    status: 500
  - connection: sextant-control
    method: POST
    path: /control/ensure
    status: 202
    body: { job_id: 44, identity_hash: "d5f3", status: queued, attached: false }
expected:
  status: Completed
  variables:
    outcome: ok
    wantsAdvance: false
    effectiveUpdate: none
  httpCalls:
    - path: "/repos/**"
      count: 0
    - connection: sextant-control
      method: POST
      path: /control/ensure
      bodyMatch:
        config_hash: "c0ffee"
        branch_name: main
        branch_update: none
        expected_head_commit: null
      count: 1
