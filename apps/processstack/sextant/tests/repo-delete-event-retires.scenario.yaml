name: repo-delete-event-retires
description: >
  (#18) A delete event carries no head commit, so its retire has no compare-and-swap. It is sent only after
  GitHub confirms the branch is still gone, and without expected_head_commit.
entrypoint: on-repository-change
event:
  event: delete
  owner: octocat
  repo: hello-world
  connectionId: conn-1
  cloneUrl: "https://github.com/octocat/hello-world.git"
  defaultBranch: main
  ref: feature/x
  refType: branch
  branch: feature/x
http:
  # Shape: GitHub REST GET /repos/{owner}/{repo}/branches (read by GitHubListBranches through Octokit).
  - connection: github
    method: GET
    path: /repos/octocat/hello-world/branches
    body:
      - name: main
        commit: { sha: "7fd1a60b01f91b314f59955a4e4d4e80d8edf11d", url: "https://api.github.com/repos/octocat/hello-world/commits/7fd1a60b01f91b314f59955a4e4d4e80d8edf11d" }
        protected: false
  # Shape: POST /control/branches/retire → {retired} (src/Sextant.Service.Host/ServiceApp.cs).
  - connection: sextant-control
    method: POST
    path: /control/branches/retire
    body: { retired: true }
expected:
  status: Completed
  variables:
    action: retire
    retireSkipped: ""
    retireOutcome: ok
    retired: true
    enrollment: ""
  httpCalls:
    - connection: github
      method: GET
      path: /repos/octocat/hello-world/branches
      count: 1
    - connection: sextant-control
      method: POST
      path: /control/branches/retire
      bodyMatch:
        repository: "https://github.com/octocat/hello-world.git"
        branch: feature/x
        expected_head_commit: null
      count: 1
