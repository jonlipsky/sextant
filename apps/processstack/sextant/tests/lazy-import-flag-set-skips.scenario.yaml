name: lazy-import-flag-set-skips
description: >
  Once the sextant.app:legacy-import-v1 flag is set, the chat does not import again, even on a first turn
  with v1 watches still in memory: the reply carries no import note and no service or GitHub call is made.
entrypoint: configure-watched-repos
principal:
  userId: u-alice
inputs:
  # The prompt-trigger envelope `app test` needs to route SendConnectionMessage (the platform sets these).
  tenantId: "sextant-test"
  applicationInstanceId: "sextant-test-instance"
  conversationId: "conv-lazy-import-flag-set-skips"
  prompt: "hello there"
  isFirstTurn: true
  channelType: "web"
seed:
  userMemory:
    - key: "sextant.app:legacy-import-v1"
      value: "2026-01-02T00:00:00.000Z"
    - key: "sextant.watched-repos:github.com/octocat/hello-world@main"
      value: '{"owner":"octocat","repo":"hello-world","branch":"main","cloneUrl":"https://github.com/octocat/hello-world.git","addedAt":"2026-01-01T00:00:00+00:00"}'
# Answers anything, so the harness records every request and `count: 0` proves none was made.
http:
  - path: "/**"
    status: 500
    body: { error: unexpected }
expected:
  status: Completed
  variables:
    verb: help
    importDone: true
    importNote: ""
    agentResponse: "I can manage the repositories you watch for Sextant indexing. Try: \"watch owner/repo on main\", \"stop watching owner/repo\", or \"what am I watching\"."
  httpCalls:
    - count: 0
