name: reconcile-behind
description: >
  (#23) A watched default branch behind GitHub's head (a push the service missed) is advanced to the head
  under the compare-and-swap of the commit the service resolved, so a push processed since the resolve wins.
entrypoint: reconcile
http:
  - connection: sextant-control
    method: GET
    path: /control/grants
    body:
      targets:
        - { repository: "https://github.com/octocat/hello-world.git", branch: "", sources: [self, tenant], watchers: 3 }
      result_count: 1
  - connection: github
    method: GET
    path: /repos/octocat/hello-world
    body:
      id: 1296269
      name: hello-world
      full_name: octocat/hello-world
      owner: { login: octocat, id: 1 }
      private: false
      default_branch: main
      html_url: "https://github.com/octocat/hello-world"
      clone_url: "https://github.com/octocat/hello-world.git"
  - connection: sextant-control
    method: GET
    path: /control/resolve
    body: { id: 7, status: complete, commit_sha: "553c2077f0edc3d5dc5d17262f6aa498e69d6f8e", branch: main, is_default: true }
  - connection: github
    method: GET
    path: /repos/octocat/hello-world/branches
    body:
      - name: main
        commit: { sha: "7fd1a60b01f91b314f59955a4e4d4e80d8edf11d", url: "https://api.github.com/repos/octocat/hello-world/commits/7fd1a60b01f91b314f59955a4e4d4e80d8edf11d" }
        protected: false
  # Shape: POST /control/ensure?wait=false → 202 EnsureSnapshotResult (src/Sextant.Service/ServiceContracts.cs).
  - connection: sextant-control
    method: POST
    path: /control/ensure
    status: 202
    body: { job_id: 60, identity_hash: "bb01", status: queued, attached: false }
expected:
  status: Completed
  variables:
    status: completed
    targetCount: 1
    upToDate: 0
    ensured: 1
    failed: 0
  httpCalls:
    - connection: sextant-control
      method: POST
      path: /control/ensure
      caller: { act: "!absent" }
      bodyMatch:
        repository_remote_url: "https://github.com/octocat/hello-world.git"
        commit_sha: "7fd1a60b01f91b314f59955a4e4d4e80d8edf11d"
        branch_name: main
        branch_update: advance
        expected_head_commit: "553c2077f0edc3d5dc5d17262f6aa498e69d6f8e"
        default_branch: true
      count: 1
