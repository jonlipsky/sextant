name: repo-push-tag-ignored
description: >
  (#17) A tag push is logged and ignored: no grant, ensure or retire is sent.
entrypoint: on-repository-change
event:
  event: push
  owner: octocat
  repo: hello-world
  connectionId: conn-1
  cloneUrl: "https://github.com/octocat/hello-world.git"
  defaultBranch: main
  ref: refs/tags/v1.0.0
  refType: tag
  branch: ""
  before: "0000000000000000000000000000000000000000"
  after: "7fd1a60b01f91b314f59955a4e4d4e80d8edf11d"
  deleted: "false"
http:
  - connection: sextant-control
    path: "/**"
    status: 500
expected:
  status: Completed
  variables:
    action: ignore
    reason: tag
    grantOutcome: ""
    ensureOutcome: ""
    retireOutcome: ""
    enrollment: ""
  httpCalls:
    - connection: sextant-control
      count: 0
