name: import-legacy-watches-not-visible
description: >
  A v1 watch on a repository the workspace's GitHub connection cannot see (404) is never granted. A process
  has no error route, so the run fails; the entry was marked first, so the next import checks it last and,
  after a second failed check, leaves it out as unresolved rather than failing every import.
entrypoint: import-legacy-watches
principal:
  userId: u-alice
inputs:
  retryUnresolved: false
seed:
  userMemory:
    - key: "sextant.watched-repos:github.com/octocat/private-repo@main"
      value: '{"owner":"octocat","repo":"private-repo","branch":"main","cloneUrl":"https://github.com/octocat/private-repo.git","addedAt":"2026-01-01T00:00:00+00:00"}'
http:
  - connection: sextant-control
    method: GET
    path: /control/grants/self
    body: { grants: [], result_count: 0 }
  # GitHub answers 404 for a repository the connection cannot see (Octokit raises NotFoundException).
  - connection: github
    method: GET
    path: /repos/octocat/private-repo
    status: 404
    body: { message: "Not Found", documentation_url: "https://docs.github.com/rest/repos/repos#get-a-repository" }
expected:
  status: Failed
  variables:
    attemptsText: '{"github.com/octocat/private-repo@main":1}'
    importedAt: ""
  httpCalls:
    - connection: github
      method: GET
      path: /repos/octocat/private-repo
      count: 1
    - connection: sextant-control
      method: PUT
      count: 0
