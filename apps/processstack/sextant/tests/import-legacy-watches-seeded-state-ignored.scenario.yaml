name: import-legacy-watches-seeded-state-ignored
description: >
  A tools/call argument naming a variable or output seeds it (elevenworks/ProcessStack#3286). The init
  reset keeps a seeded plan, repository URL or count from reaching a grant or an output: only the caller's
  own memory entry is checked and granted, and the counts are this run's.
entrypoint: import-legacy-watches
principal:
  userId: u-alice
inputs:
  retryUnresolved: false
  pending: '[{"owner":"evil","repo":"repo","branch":"main","slug":"github.com/evil/repo@main"}]'
  index: 0
  remoteUrl: "https://github.com/evil/repo.git"
  accepted: true
  currentOwner: evil
  currentRepo: repo
  currentBranch: main
  resolvedSlug: "github.com/octocat/hello-world@main"
  resolution: imported
  attemptsText: '{"github.com/evil/repo@main":1}'
  imported: 99
  newlyImported: 99
  skipped: 99
  failed: 99
  remaining: 99
  retried: true
  limitReached: true
  complete: true
  outcome: seeded
  message: seeded
  importedAt: seeded
http:
  - connection: sextant-control
    method: GET
    path: /control/grants/self
    body: { grants: [], result_count: 0 }
  - connection: github
    method: GET
    path: /repos/octocat/hello-world
    body:
      id: 1296269
      name: hello-world
      full_name: octocat/hello-world
      owner: { login: octocat, id: 1 }
      private: false
      default_branch: main
  - connection: sextant-control
    method: PUT
    path: /control/grants/self
    bodyMatch: { repository: "https://github.com/octocat/hello-world.git" }
    body:
      grant: { repository: "https://github.com/octocat/hello-world.git", branch: "", source: self, created_at: 1760000000 }
      created: true
seed:
  userMemory:
    - key: "sextant.watched-repos:github.com/octocat/hello-world@main"
      value: '{"owner":"octocat","repo":"hello-world","branch":"main","cloneUrl":"https://github.com/octocat/hello-world.git","addedAt":"2026-01-01T00:00:00+00:00"}'
expected:
  status: Completed
  variables:
    imported: 1
    newlyImported: 1
    skipped: 0
    failed: 0
    remaining: 0
    complete: true
    outcome: ok
    message: "Imported 1 earlier Sextant watch."
    attemptsText: "{}"
    importedAt: "!not_empty"
  httpCalls:
    - connection: github
      path: /repos/evil/**
      count: 0
    - connection: github
      method: GET
      path: /repos/octocat/hello-world
      count: 1
    - connection: sextant-control
      method: PUT
      count: 1
