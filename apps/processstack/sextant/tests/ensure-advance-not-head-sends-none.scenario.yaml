name: ensure-advance-not-head-sends-none
description: >
  internal is not enforced on a direct run (elevenworks/ProcessStack#3287), so ensure enforces the advance
  rule itself: a request to advance main to a commit that is not main's GitHub head (an older commit, or one
  GitHub serves from another ref) indexes the commit with branch_update "none" and moves nothing, whatever
  compare-and-swap value it carries.
entrypoint: ensure
principal:
  userId: u-alice
inputs:
  repositoryRemoteUrl: "https://github.com/octocat/hello-world.git"
  commitSha: "b3cbd5bbd7e81436d2eee04537ea2b4c0cad4cdf"
  branchName: main
  branchUpdate: advance
  expectedHeadCommit: "7fd1a60b01f91b314f59955a4e4d4e80d8edf11d"
http:
  # Shape: GitHub REST GET /repos/{owner}/{repo}/branches (read by GitHubListBranches through Octokit).
  - connection: github
    method: GET
    path: /repos/octocat/hello-world/branches
    body:
      - name: main
        commit: { sha: "7fd1a60b01f91b314f59955a4e4d4e80d8edf11d", url: "https://api.github.com/repos/octocat/hello-world/commits/7fd1a60b01f91b314f59955a4e4d4e80d8edf11d" }
        protected: false
      - name: feature/x
        commit: { sha: "b3cbd5bbd7e81436d2eee04537ea2b4c0cad4cdf", url: "https://api.github.com/repos/octocat/hello-world/commits/b3cbd5bbd7e81436d2eee04537ea2b4c0cad4cdf" }
        protected: false
  - connection: sextant-control
    method: POST
    path: /control/ensure
    status: 202
    body: { job_id: 43, identity_hash: "c4e2", status: queued, attached: false }
expected:
  status: Completed
  variables:
    outcome: ok
    jobId: "43"
    headConfirmed: false
    effectiveUpdate: none
  httpCalls:
    - method: GET
      path: /repos/octocat/hello-world/branches
      count: 1
    - connection: sextant-control
      method: POST
      path: /control/ensure
      bodyMatch:
        commit_sha: "b3cbd5bbd7e81436d2eee04537ea2b4c0cad4cdf"
        branch_name: main
        branch_update: none
        expected_head_commit: null
      count: 1
