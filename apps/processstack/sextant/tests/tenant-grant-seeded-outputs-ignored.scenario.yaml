name: tenant-grant-seeded-outputs-ignored
description: >
  A run seeds variables from undeclared inputs (elevenworks/ProcessStack#3286). tenant-grant resets every
  variable and output first, so a seeded "granted" outcome or checked URL never reports or sends a grant for
  a repository that fails the URL shape rules.
entrypoint: tenant-grant
inputs:
  repository: "http://github.com/octocat/hello-world.git"
  urlAccepted: true
  checkedUrl: "https://github.com/octocat/hello-world.git"
  outcome: granted
  created: true
  statusCode: 200
  reason: ""
http:
  - connection: sextant-control
    path: "/**"
    status: 500
expected:
  status: Completed
  variables:
    outcome: rejected
    reason: invalid_repository
    created: false
    statusCode: 0
  httpCalls:
    - connection: sextant-control
      count: 0
