name: import-legacy-watches-service-unavailable
description: >
  When the service cannot list the caller's grants, nothing is checked or granted and the import flag is
  not set, so the chat imports again on the next turn.
entrypoint: import-legacy-watches
principal:
  userId: u-alice
inputs:
  retryUnresolved: false
seed:
  userMemory:
    - key: "sextant.watched-repos:github.com/octocat/hello-world@main"
      value: '{"owner":"octocat","repo":"hello-world","branch":"main","cloneUrl":"https://github.com/octocat/hello-world.git","addedAt":"2026-01-01T00:00:00+00:00"}'
http:
  - connection: sextant-control
    method: GET
    path: /control/grants/self
    status: 503
    body: { status: unavailable }
expected:
  status: Completed
  variables:
    imported: 0
    newlyImported: 0
    skipped: 0
    failed: 0
    complete: false
    outcome: unavailable
    message: "The Sextant service could not answer right now, so your earlier watches were not imported yet. Try again later."
    importedAt: ""
  httpCalls:
    - connection: github
      path: "/repos/**"
      count: 0
    - connection: sextant-control
      method: PUT
      count: 0
