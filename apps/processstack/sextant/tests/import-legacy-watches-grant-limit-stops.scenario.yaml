name: import-legacy-watches-grant-limit-stops
description: >
  The watch limit ends the import: after the first 409 grant_limit every later entry would be refused too,
  so none of them is checked with GitHub or sent to the service. They are marked unresolved and counted as
  failed, as their own 409 would have left them, and the import is complete (retryUnresolved checks them
  again once the caller has room).
entrypoint: import-legacy-watches
principal:
  userId: u-alice
inputs:
  retryUnresolved: false
seed:
  userMemory:
    - key: "sextant.watched-repos:github.com/octo/alpha@main"
      value: '{"owner":"octo","repo":"alpha","branch":"main","cloneUrl":"https://github.com/octo/alpha.git","addedAt":"2026-01-01T00:00:00+00:00"}'
    - key: "sextant.watched-repos:github.com/octo/beta@main"
      value: '{"owner":"octo","repo":"beta","branch":"main","cloneUrl":"https://github.com/octo/beta.git","addedAt":"2026-01-01T00:00:00+00:00"}'
    - key: "sextant.watched-repos:github.com/octo/gamma@main"
      value: '{"owner":"octo","repo":"gamma","branch":"main","cloneUrl":"https://github.com/octo/gamma.git","addedAt":"2026-01-01T00:00:00+00:00"}'
http:
  - connection: sextant-control
    method: GET
    path: /control/grants/self
    body: { grants: [], result_count: 0 }
  - connection: github
    method: GET
    path: /repos/octo/alpha
    body: { id: 1, name: alpha, full_name: octo/alpha, owner: { login: octo, id: 1 }, default_branch: main }
  - connection: github
    method: GET
    path: /repos/octo/beta
    body: { id: 2, name: beta, full_name: octo/beta, owner: { login: octo, id: 1 }, default_branch: main }
  - connection: github
    method: GET
    path: /repos/octo/gamma
    body: { id: 3, name: gamma, full_name: octo/gamma, owner: { login: octo, id: 1 }, default_branch: main }
  - connection: sextant-control
    method: PUT
    path: /control/grants/self
    status: 409
    body: { status: rejected, reason: grant_limit }
expected:
  status: Completed
  variables:
    imported: 0
    newlyImported: 0
    skipped: 0
    failed: 3
    remaining: 0
    complete: true
    outcome: ok
    message: "3 earlier watches could not be imported right now: the Sextant service did not accept it, or you are watching as many repositories as allowed."
    attemptsText: '{"github.com/octo/alpha@main":2,"github.com/octo/beta@main":2,"github.com/octo/gamma@main":2}'
    importedAt: "!not_empty"
  httpCalls:
    - connection: github
      method: GET
      path: /repos/octo/alpha
      count: 1
    - connection: github
      path: /repos/octo/beta
      count: 0
    - connection: github
      path: /repos/octo/gamma
      count: 0
    - connection: sextant-control
      method: PUT
      path: /control/grants/self
      caller: { act: user, idp: processstack, sub: u-alice }
      bodyMatch: { repository: "https://github.com/octo/alpha.git" }
      count: 1
    - connection: sextant-control
      method: PUT
      count: 1
