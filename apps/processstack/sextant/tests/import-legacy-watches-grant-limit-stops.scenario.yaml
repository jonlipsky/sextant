name: import-legacy-watches-grant-limit-stops
description: >
  After the first 409 grant_limit (alpha) a new grant would be refused too, so an entry on a repository the
  caller has no grant on (beta, right after the limit, and delta) is not checked with GitHub or sent to the
  service: it is marked unresolved and counted as failed, as its own 409 would have left it. An entry that
  may already be held is still checked: gamma (a default-branch grant the service has not resolved) answers
  200 created: false and is imported; epsilon (a grant on another branch, so its default-branch grant is
  new) answers a second grant_limit, which moves nothing the first one decided. The import is complete
  (retryUnresolved checks the others again once the caller has room).
entrypoint: import-legacy-watches
principal:
  userId: u-alice
inputs:
  retryUnresolved: false
seed:
  userMemory:
    - key: "sextant.watched-repos:github.com/octo/alpha@main"
      value: '{"owner":"octo","repo":"alpha","branch":"main","cloneUrl":"https://github.com/octo/alpha.git","addedAt":"2026-01-01T00:00:00+00:00"}'
    - key: "sextant.watched-repos:github.com/octo/beta@main"
      value: '{"owner":"octo","repo":"beta","branch":"main","cloneUrl":"https://github.com/octo/beta.git","addedAt":"2026-01-01T00:00:00+00:00"}'
    - key: "sextant.watched-repos:github.com/octo/gamma@main"
      value: '{"owner":"octo","repo":"gamma","branch":"main","cloneUrl":"https://github.com/octo/gamma.git","addedAt":"2026-01-01T00:00:00+00:00"}'
    - key: "sextant.watched-repos:github.com/octo/delta@main"
      value: '{"owner":"octo","repo":"delta","branch":"main","cloneUrl":"https://github.com/octo/delta.git","addedAt":"2026-01-01T00:00:00+00:00"}'
    - key: "sextant.watched-repos:github.com/octo/epsilon@main"
      value: '{"owner":"octo","repo":"epsilon","branch":"main","cloneUrl":"https://github.com/octo/epsilon.git","addedAt":"2026-01-01T00:00:00+00:00"}'
http:
  - connection: sextant-control
    method: GET
    path: /control/grants/self
    body:
      grants:
        - repository: "https://github.com/octo/gamma.git"
          branch: ""
          source: self
          created_at: 1760000000
          status: { resolved_branch: null, snapshot_status: missing }
        - repository: "https://github.com/octo/epsilon.git"
          branch: dev
          source: self
          created_at: 1760000000
          status: { resolved_branch: dev, snapshot_status: missing }
      result_count: 2
  - connection: github
    method: GET
    path: /repos/octo/alpha
    body: { id: 1, name: alpha, full_name: octo/alpha, owner: { login: octo, id: 1 }, default_branch: main }
  - connection: github
    method: GET
    path: /repos/octo/beta
    body: { id: 2, name: beta, full_name: octo/beta, owner: { login: octo, id: 1 }, default_branch: main }
  - connection: github
    method: GET
    path: /repos/octo/gamma
    body: { id: 3, name: gamma, full_name: octo/gamma, owner: { login: octo, id: 1 }, default_branch: main }
  - connection: github
    method: GET
    path: /repos/octo/delta
    body: { id: 4, name: delta, full_name: octo/delta, owner: { login: octo, id: 1 }, default_branch: main }
  - connection: github
    method: GET
    path: /repos/octo/epsilon
    body: { id: 5, name: epsilon, full_name: octo/epsilon, owner: { login: octo, id: 1 }, default_branch: main }
  - connection: sextant-control
    method: PUT
    path: /control/grants/self
    bodyMatch: { repository: "https://github.com/octo/gamma.git" }
    body:
      grant: { repository: "https://github.com/octo/gamma.git", branch: "", source: self, created_at: 1760000000 }
      created: false
  - connection: sextant-control
    method: PUT
    path: /control/grants/self
    status: 409
    body: { status: rejected, reason: grant_limit }
expected:
  status: Completed
  variables:
    imported: 1
    newlyImported: 0
    skipped: 0
    failed: 4
    remaining: 0
    complete: true
    outcome: ok
    message: "Imported 1 earlier Sextant watch.\n4 earlier watches could not be imported right now: the Sextant service did not accept it, or you are watching as many repositories as allowed."
    attemptsText: '{"github.com/octo/alpha@main":2,"github.com/octo/epsilon@main":2,"github.com/octo/beta@main":2,"github.com/octo/delta@main":2}'
    importedAt: "!not_empty"
  httpCalls:
    - connection: github
      path: /repos/octo/alpha
      count: 1
    - connection: github
      path: /repos/octo/beta
      count: 0
    - connection: github
      path: /repos/octo/gamma
      count: 1
    - connection: github
      path: /repos/octo/delta
      count: 0
    - connection: github
      path: /repos/octo/epsilon
      count: 1
    - connection: sextant-control
      method: PUT
      path: /control/grants/self
      caller: { act: user, idp: processstack, sub: u-alice }
      bodyMatch: { repository: "https://github.com/octo/alpha.git" }
      count: 1
    - connection: sextant-control
      method: PUT
      bodyMatch: { repository: "https://github.com/octo/gamma.git" }
      count: 1
    - connection: sextant-control
      method: PUT
      bodyMatch: { repository: "https://github.com/octo/epsilon.git", branch: null }
      count: 1
    - connection: sextant-control
      method: PUT
      count: 3
