name: repo-delete-event-user-run-refused
description: >
  A user starts on-repository-change directly with a delete event of their choosing. The service refuses
  the tenant grant (403 wrong_actor), so the flow sends nothing else: GitHub is not asked, and no retire is
  sent (a delete event's retire has no compare-and-swap).
entrypoint: on-repository-change
principal:
  userId: u-mallory
event:
  event: delete
  owner: octocat
  repo: hello-world
  connectionId: conn-1
  cloneUrl: "https://github.com/octocat/hello-world.git"
  defaultBranch: main
  ref: feature/x
  refType: branch
  branch: feature/x
http:
  - connection: sextant-control
    method: PUT
    path: /control/grants/tenant
    status: 403
    body: { status: rejected, reason: wrong_actor }
  - connection: github
    method: GET
    path: /repos/octocat/hello-world/branches
    body:
      - name: main
        commit: { sha: "7fd1a60b01f91b314f59955a4e4d4e80d8edf11d", url: "https://api.github.com/repos/octocat/hello-world/commits/7fd1a60b01f91b314f59955a4e4d4e80d8edf11d" }
        protected: false
  - connection: sextant-control
    method: POST
    path: /control/branches/retire
    body: { retired: true }
expected:
  status: Completed
  variables:
    action: retire
    grantOutcome: unauthorized
    retireSkipped: ""
    retireOutcome: ""
    retired: false
    enrollment: ""
  httpCalls:
    - connection: sextant-control
      method: PUT
      path: /control/grants/tenant
      caller: { act: user, sub: u-mallory }
      count: 1
    - connection: sextant-control
      count: 1
    - connection: github
      path: "/repos/**"
      count: 0
