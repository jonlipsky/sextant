name: reconcile-grants-refused
description: >
  A run that is not the application's (here a user's direct run) is refused the tenant's targets (403): the
  reconcile reports refused and sends nothing else. The listing comes first, so the legacy import sends no
  grant for the enrolled rows either.
entrypoint: reconcile
principal:
  userId: u-mallory
seed:
  appState:
    - tenantId: test-tenant
      applicationName: sextant
      kv:
        - key: "enrolled/conn-1/github.com/octocat/hello-world@main"
          value: '{"ConnectionId":"conn-1","Host":"github.com","Owner":"octocat","Repo":"hello-world","Branch":"main","CloneUrl":"https://github.com/octocat/hello-world.git","Slug":"github.com/octocat/hello-world@main","EnrolledAt":"2026-01-01T00:00:00+00:00"}'
http:
  - connection: sextant-control
    method: GET
    path: /control/grants
    status: 403
    body: { status: rejected, reason: wrong_actor }
  - connection: sextant-control
    method: POST
    path: "/**"
    status: 500
  - connection: sextant-control
    method: PUT
    path: "/**"
    status: 500
expected:
  status: Completed
  variables:
    status: refused
    legacyRows: 0
    targetCount: 0
    ensured: 0
    retired: 0
  httpCalls:
    - connection: sextant-control
      count: 1
    - connection: github
      path: "/repos/**"
      count: 0
