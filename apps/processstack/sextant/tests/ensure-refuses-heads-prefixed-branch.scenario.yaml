name: ensure-refuses-heads-prefixed-branch
description: >
  Every caller drops a leading refs/heads/ before it calls ensure, so a branch name that still starts with it
  is refused (invalid_branch) rather than stripped a second time: the branch the caller checked, read and
  compared (refs/heads/x) must not be sent as another branch (x). Nothing is sent.
entrypoint: ensure
principal:
  userId: u-alice
inputs:
  repositoryRemoteUrl: "https://github.com/octocat/hello-world.git"
  commitSha: "7fd1a60b01f91b314f59955a4e4d4e80d8edf11d"
  branchName: "refs/heads/x"
  branchUpdate: advance
  expectedHeadCommit: ""
http:
  - path: "/**"
    status: 500
expected:
  status: Completed
  variables:
    outcome: rejected
    reason: invalid_branch
    statusCode: 0
    jobId: ""
  httpCalls:
    - count: 0
