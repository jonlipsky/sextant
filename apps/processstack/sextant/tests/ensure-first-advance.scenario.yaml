name: ensure-first-advance
description: >
  A first ensure of a branch sends the compare-and-swap "the branch does not exist yet": an all-zeros
  expected head becomes expected_head_commit "", with branch_update "advance".
entrypoint: ensure
principal:
  userId: u-alice
inputs:
  repositoryRemoteUrl: "https://github.com/octocat/hello-world.git"
  commitSha: "7fd1a60b01f91b314f59955a4e4d4e80d8edf11d"
  branchName: main
  branchUpdate: advance
  expectedHeadCommit: "0000000000000000000000000000000000000000"
http:
  - connection: sextant-control
    method: POST
    path: /control/ensure
    status: 202
    body: { job_id: 42, identity_hash: "9b1d", status: running, attached: false }
expected:
  status: Completed
  variables:
    outcome: ok
    effectiveUpdate: advance
    jobStatus: running
    terminal: false
  httpCalls:
    - connection: sextant-control
      method: POST
      path: /control/ensure
      bodyMatch:
        branch_name: main
        branch_update: advance
        expected_head_commit: ""
        default_branch: null
        branch_head_sequence: null
      count: 1
