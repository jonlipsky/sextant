name: lazy-legacy-import
description: >
  (#11) On the first internal-channel message with no sextant.app:legacy-import-v1 flag, the chat imports the
  caller's v1 watches before it answers: two entries become two grants (one PUT each), the tombstone is
  skipped, and the reply starts with the import's note. The import sets the flag, so a later turn does not
  import again (lazy-import-flag-set-skips).
entrypoint: configure-watched-repos
principal:
  userId: u-alice
inputs:
  # The prompt-trigger envelope `app test` needs to route SendConnectionMessage (the platform sets these).
  tenantId: "sextant-test"
  applicationInstanceId: "sextant-test-instance"
  conversationId: "conv-lazy-legacy-import"
  prompt: "list my watched repos"
  isFirstTurn: true
  channelType: "web"
seed:
  userMemory:
    - key: "sextant.watched-repos:github.com/octocat/hello-world@main"
      value: '{"owner":"octocat","repo":"hello-world","branch":"main","cloneUrl":"https://github.com/octocat/hello-world.git","addedAt":"2026-01-01T00:00:00+00:00"}'
    - key: "sextant.watched-repos:github.com/octocat/spoon-knife@feature/x"
      value: '{"owner":"octocat","repo":"spoon-knife","branch":"feature/x","cloneUrl":"https://github.com/octocat/spoon-knife.git","addedAt":"2026-01-01T00:00:00+00:00"}'
    - key: "sextant.watched-repos:github.com/octocat/removed@main"
      value: "null"
http:
  # The import's read of the caller's grants (none yet), then the list command's read after the import.
  - connection: sextant-control
    method: GET
    path: /control/grants/self
    times: 1
    body: { grants: [], result_count: 0 }
  - connection: sextant-control
    method: GET
    path: /control/grants/self
    body:
      grants:
        - repository: "https://github.com/octocat/hello-world.git"
          branch: ""
          source: self
          created_at: 1760000000
          status: { resolved_branch: main, snapshot_status: missing }
        - repository: "https://github.com/octocat/spoon-knife.git"
          branch: "feature/x"
          source: self
          created_at: 1760000000
          status: { resolved_branch: "feature/x", snapshot_status: missing }
      result_count: 2
  - connection: github
    method: GET
    path: /repos/octocat/hello-world
    body: { id: 1296269, name: hello-world, full_name: octocat/hello-world, owner: { login: octocat, id: 1 }, default_branch: main }
  - connection: github
    method: GET
    path: /repos/octocat/spoon-knife
    body: { id: 1300192, name: spoon-knife, full_name: octocat/spoon-knife, owner: { login: octocat, id: 1 }, default_branch: main }
  - connection: sextant-control
    method: PUT
    path: /control/grants/self
    body:
      grant: { repository: "https://github.com/octocat/hello-world.git", branch: "", source: self, created_at: 1760000000 }
      created: true
expected:
  status: Completed
  variables:
    verb: list
    importDone: false
    agentResponse: "Imported 2 earlier Sextant watches.\n\nYou are watching 2 repositories:\n- octocat/hello-world on main (default): not indexed yet\n- octocat/spoon-knife on feature/x: not indexed yet"
  httpCalls:
    - connection: github
      path: "/repos/**"
      count: 2
    - connection: sextant-control
      method: PUT
      path: /control/grants/self
      caller: { act: user, idp: processstack, sub: u-alice }
      bodyMatch: { repository: "https://github.com/octocat/hello-world.git", branch: null }
      count: 1
    - connection: sextant-control
      method: PUT
      path: /control/grants/self
      caller: { act: user, idp: processstack, sub: u-alice }
      bodyMatch: { repository: "https://github.com/octocat/spoon-knife.git", branch: "feature/x" }
      count: 1
    - connection: sextant-control
      method: GET
      path: /control/grants/self
      count: 2
