name: repo-push-branch-create
description: >
  (#15) A push that creates a branch has an all-zero `before`, so its ensure carries the CAS
  expected_head_commit "" (the branch must not exist yet), never the zeros.
entrypoint: on-repository-change
event:
  event: push
  owner: octocat
  repo: hello-world
  connectionId: conn-1
  cloneUrl: "https://github.com/octocat/hello-world.git"
  defaultBranch: main
  ref: refs/heads/feature/new
  refType: branch
  branch: feature/new
  before: "0000000000000000000000000000000000000000"
  after: "b3cbd5bbd7e81436d2eee04537ea2b4c0cad4cdf"
  forced: "false"
  created: "true"
  deleted: "false"
http:
  - connection: sextant-control
    method: PUT
    path: /control/grants/tenant
    body:
      grant: { repository: "https://github.com/octocat/hello-world.git", branch: "", source: tenant, created_at: 1760000000 }
      created: false
  - connection: sextant-control
    method: POST
    path: /control/ensure
    status: 202
    body: { job_id: 44, identity_hash: "9b1f", status: queued, attached: false }
expected:
  status: Completed
  variables:
    action: ensure
    grantOutcome: granted
    ensureOutcome: ok
  httpCalls:
    - connection: sextant-control
      method: POST
      path: /control/ensure
      bodyMatch:
        commit_sha: "b3cbd5bbd7e81436d2eee04537ea2b4c0cad4cdf"
        branch_name: feature/new
        branch_update: advance
        expected_head_commit: ""
        default_branch: false
      count: 1
