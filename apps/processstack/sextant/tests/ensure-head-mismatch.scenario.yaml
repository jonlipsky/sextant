name: ensure-head-mismatch
description: >
  A compare-and-swap the branch no longer matches is the service's 409 head_mismatch: outcome head_mismatch.
entrypoint: ensure
principal:
  userId: u-alice
inputs:
  repositoryRemoteUrl: "https://github.com/octocat/hello-world.git"
  commitSha: "7fd1a60b01f91b314f59955a4e4d4e80d8edf11d"
  branchName: main
  branchUpdate: advance
  expectedHeadCommit: "1111111111111111111111111111111111111111"
http:
  - connection: sextant-control
    method: POST
    path: /control/ensure
    status: 409
    body: { status: rejected, reason: head_mismatch }
expected:
  status: Completed
  variables:
    outcome: head_mismatch
    reason: head_mismatch
