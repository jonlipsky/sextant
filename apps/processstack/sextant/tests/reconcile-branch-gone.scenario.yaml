name: reconcile-branch-gone
description: >
  (#25) A watched branch GitHub no longer has (a delete the service missed) is retired under the
  compare-and-swap of the commit the service resolved before the listing, so a branch re-created since then
  is kept.
entrypoint: reconcile
http:
  - connection: sextant-control
    method: GET
    path: /control/grants
    body:
      targets:
        - { repository: "https://github.com/octocat/hello-world.git", branch: feature/x, sources: [self], watchers: 1 }
      result_count: 1
  - connection: github
    method: GET
    path: /repos/octocat/hello-world
    body:
      id: 1296269
      name: hello-world
      full_name: octocat/hello-world
      owner: { login: octocat, id: 1 }
      private: false
      default_branch: main
      html_url: "https://github.com/octocat/hello-world"
      clone_url: "https://github.com/octocat/hello-world.git"
  - connection: sextant-control
    method: GET
    path: /control/resolve
    body: { id: 8, status: complete, commit_sha: "b3cbd5bbd7e81436d2eee04537ea2b4c0cad4cdf", branch: feature/x, is_default: false }
  - connection: github
    method: GET
    path: /repos/octocat/hello-world/branches
    body:
      - name: main
        commit: { sha: "7fd1a60b01f91b314f59955a4e4d4e80d8edf11d", url: "https://api.github.com/repos/octocat/hello-world/commits/7fd1a60b01f91b314f59955a4e4d4e80d8edf11d" }
        protected: false
  # Shape: POST /control/branches/retire → {retired} (src/Sextant.Service.Host/ServiceApp.cs).
  - connection: sextant-control
    method: POST
    path: /control/branches/retire
    body: { retired: true }
expected:
  status: Completed
  variables:
    status: completed
    targetCount: 1
    retired: 1
    ensured: 0
    failed: 0
  httpCalls:
    - connection: sextant-control
      method: POST
      path: /control/branches/retire
      caller: { act: "!absent" }
      bodyMatch:
        repository: "https://github.com/octocat/hello-world.git"
        branch: feature/x
        expected_head_commit: "b3cbd5bbd7e81436d2eee04537ea2b4c0cad4cdf"
      count: 1
    - connection: sextant-control
      path: /control/ensure
      count: 0
