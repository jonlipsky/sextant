name: list-empty
description: >
  (#8) "what am i watching" with no grants reads GET /control/grants/self as the calling user and says
  nothing is watched yet.
entrypoint: configure-watched-repos
principal:
  userId: u-alice
inputs:
  # The prompt-trigger envelope `app test` needs to route SendConnectionMessage (the platform sets these).
  tenantId: "sextant-test"
  applicationInstanceId: "sextant-test-instance"
  conversationId: "conv-list-empty"
  prompt: "what am i watching?"
  isFirstTurn: false
  channelType: "web"
# Shape: GrantEndpoints.ListSelf → GrantListResponse (src/Sextant.Service/Grants/GrantContracts.cs).
http:
  - connection: sextant-control
    method: GET
    path: /control/grants/self
    body: { grants: [], result_count: 0 }
expected:
  status: Completed
  variables:
    verb: list
    agentResponse: "!contains:not watching any repositories yet"
  httpCalls:
    - connection: sextant-control
      method: GET
      path: /control/grants/self
      caller: { act: user, idp: processstack, sub: u-alice, via: activity }
      count: 1
    - method: PUT
      count: 0
