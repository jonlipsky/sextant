name: repo-pr-opened
description: >
  (#19) An opened pull request publishes its base and head commits with branch_update none, so no branch
  pointer moves and no grant is recorded. The head is in the base repository, so it is ensured too, under
  its own branch name.
entrypoint: on-repository-change
event:
  event: pull_request
  action: opened
  owner: octocat
  repo: hello-world
  connectionId: conn-1
  cloneUrl: "https://github.com/octocat/hello-world.git"
  defaultBranch: main
  pullNumber: "7"
  baseRef: main
  baseSha: "7fd1a60b01f91b314f59955a4e4d4e80d8edf11d"
  headRef: fix/typo
  headSha: "6dcb09b5b57875f334f61aebed695e2e4193db5e"
  headCloneUrl: "https://github.com/octocat/hello-world.git"
  merged: "false"
http:
  - connection: sextant-control
    method: POST
    path: /control/ensure
    bodyMatch: { commit_sha: "7fd1a60b01f91b314f59955a4e4d4e80d8edf11d" }
    body: { job_id: 50, identity_hash: "aa01", status: complete, attached: true, branch_advanced: false }
  - connection: sextant-control
    method: POST
    path: /control/ensure
    bodyMatch: { commit_sha: "6dcb09b5b57875f334f61aebed695e2e4193db5e" }
    status: 202
    body: { job_id: 51, identity_hash: "aa02", status: queued, attached: false }
expected:
  status: Completed
  variables:
    action: ensure
    reason: ""
    grantOutcome: ""
    ensureOutcome: attached
    headEnsureOutcome: ok
    enrollment: ""
  httpCalls:
    - connection: sextant-control
      path: /control/grants/tenant
      count: 0
    - connection: sextant-control
      method: POST
      path: /control/ensure
      bodyMatch:
        repository_remote_url: "https://github.com/octocat/hello-world.git"
        commit_sha: "7fd1a60b01f91b314f59955a4e4d4e80d8edf11d"
        branch_name: main
        branch_update: none
        expected_head_commit: null
        default_branch: null
      count: 1
    - connection: sextant-control
      method: POST
      path: /control/ensure
      bodyMatch:
        repository_remote_url: "https://github.com/octocat/hello-world.git"
        commit_sha: "6dcb09b5b57875f334f61aebed695e2e4193db5e"
        branch_name: fix/typo
        branch_update: none
        expected_head_commit: null
        default_branch: null
      count: 1
