name: start-indexing-other-host-refused
description: >
  Only a github.com repository can be checked against the workspace's GitHub connection, so a repository
  on another host is refused before any call (reason unsupported_host).
entrypoint: start-indexing
principal:
  userId: u-alice
inputs:
  repositoryRemoteUrl: "https://gitlab.com/octocat/hello-world.git"
  commitSha: "7fd1a60b01f91b314f59955a4e4d4e80d8edf11d"
http:
  - path: "/**"
    status: 500
expected:
  status: Completed
  variables:
    outcome: rejected
    reason: unsupported_host
    jobId: ""
    message: "Only github.com repositories can be indexed through the Sextant app."
  httpCalls:
    - count: 0
