name: watch-rejected
description: >
  (#4) A 400 from PUT /control/grants/self shows the service's reason code; nothing is written to the v1
  memory and no ensure is sent.
entrypoint: grant-watch
principal:
  userId: u-alice
inputs:
  host: github.com
  owner: octocat
  repo: hello-world
http:
  # Shape: GitHub REST GET /repos/{owner}/{repo} (read by GitHubGetRepository through Octokit).
  - connection: github
    method: GET
    path: /repos/octocat/hello-world
    body:
      id: 1296269
      name: hello-world
      full_name: octocat/hello-world
      owner: { login: octocat, id: 1 }
      private: false
      default_branch: main
      html_url: "https://github.com/octocat/hello-world"
      clone_url: "https://github.com/octocat/hello-world.git"
  - connection: sextant-control
    method: PUT
    path: /control/grants/self
    status: 400
    body: { status: rejected, reason: host_not_allowed }
expected:
  status: Completed
  variables:
    granted: false
    memoryKeys: ""
    message: "The Sextant service would not watch octocat/hello-world (host_not_allowed)."
  httpCalls:
    - connection: sextant-control
      method: GET
      path: /control/grants/self
      count: 0
