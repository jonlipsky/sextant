name: reconcile-missing
description: >
  (#24) A watched branch the service has never indexed (resolve 404) is ensured at GitHub's head with the
  compare-and-swap expected_head_commit "" (the branch must still be absent).
entrypoint: reconcile
http:
  - connection: sextant-control
    method: GET
    path: /control/grants
    body:
      targets:
        - { repository: "https://github.com/octocat/hello-world.git", branch: feature/x, sources: [self], watchers: 1 }
      result_count: 1
  - connection: github
    method: GET
    path: /repos/octocat/hello-world
    body:
      id: 1296269
      name: hello-world
      full_name: octocat/hello-world
      owner: { login: octocat, id: 1 }
      private: false
      default_branch: main
      html_url: "https://github.com/octocat/hello-world"
      clone_url: "https://github.com/octocat/hello-world.git"
  - connection: sextant-control
    method: GET
    path: /control/resolve
    status: 404
  - connection: github
    method: GET
    path: /repos/octocat/hello-world/branches
    body:
      - name: main
        commit: { sha: "7fd1a60b01f91b314f59955a4e4d4e80d8edf11d", url: "https://api.github.com/repos/octocat/hello-world/commits/7fd1a60b01f91b314f59955a4e4d4e80d8edf11d" }
        protected: false
      - name: feature/x
        commit: { sha: "b3cbd5bbd7e81436d2eee04537ea2b4c0cad4cdf", url: "https://api.github.com/repos/octocat/hello-world/commits/b3cbd5bbd7e81436d2eee04537ea2b4c0cad4cdf" }
        protected: false
  - connection: sextant-control
    method: POST
    path: /control/ensure
    status: 202
    body: { job_id: 61, identity_hash: "bb02", status: queued, attached: false }
expected:
  status: Completed
  variables:
    status: completed
    targetCount: 1
    ensured: 1
    failed: 0
  httpCalls:
    - connection: sextant-control
      method: POST
      path: /control/ensure
      bodyMatch:
        repository_remote_url: "https://github.com/octocat/hello-world.git"
        commit_sha: "b3cbd5bbd7e81436d2eee04537ea2b4c0cad4cdf"
        branch_name: feature/x
        branch_update: advance
        expected_head_commit: ""
        default_branch: false
      count: 1
