name: get-indexing-status-seeded-response-ignored
description: >
  A 200 whose body is not JSON is an error, not a found job, even with a responseJson argument naming one
  (a run seeds variables from undeclared inputs, elevenworks/ProcessStack#3286). The process resets
  responseJson first, and the request's empty json output replaces it too.
entrypoint: get-indexing-status
principal:
  userId: u-alice
inputs:
  jobId: "42"
  responseJson:
    job:
      status: complete
      snapshot_id: 9
      last_error: null
http:
  - connection: sextant-control
    method: GET
    path: /control/status/42
    body: "not json"
expected:
  status: Completed
  variables:
    found: false
    indexingState: ""
    snapshotId: ""
    outcome: error
