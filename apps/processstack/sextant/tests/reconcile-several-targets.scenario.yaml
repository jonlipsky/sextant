name: reconcile-several-targets
description: >
  The reconcile brings each target in line independently (four at a time) and tallies the results: two
  github.com repositories never indexed are ensured, and a target outside github.com (which the tenant's
  GitHub connection cannot read) is skipped.
entrypoint: reconcile
http:
  - connection: sextant-control
    method: GET
    path: /control/grants
    body:
      targets:
        - { repository: "https://github.com/octocat/hello-world.git", branch: "", sources: [tenant], watchers: 1 }
        - { repository: "https://github.com/octocat/spoon-knife.git", branch: "", sources: [self], watchers: 1 }
        - { repository: "https://gitlab.example.com/octocat/elsewhere.git", branch: "", sources: [tenant], watchers: 1 }
      result_count: 3
  - connection: github
    method: GET
    path: /repos/octocat/hello-world
    body:
      id: 1296269
      name: hello-world
      full_name: octocat/hello-world
      owner: { login: octocat, id: 1 }
      private: false
      default_branch: main
      html_url: "https://github.com/octocat/hello-world"
      clone_url: "https://github.com/octocat/hello-world.git"
  - connection: github
    method: GET
    path: /repos/octocat/spoon-knife
    body:
      id: 1300192
      name: spoon-knife
      full_name: octocat/spoon-knife
      owner: { login: octocat, id: 1 }
      private: false
      default_branch: trunk
      html_url: "https://github.com/octocat/spoon-knife"
      clone_url: "https://github.com/octocat/spoon-knife.git"
  - connection: sextant-control
    method: GET
    path: /control/resolve
    status: 404
  - connection: github
    method: GET
    path: /repos/octocat/hello-world/branches
    body:
      - name: main
        commit: { sha: "7fd1a60b01f91b314f59955a4e4d4e80d8edf11d", url: "https://api.github.com/repos/octocat/hello-world/commits/7fd1a60b01f91b314f59955a4e4d4e80d8edf11d" }
        protected: false
  - connection: github
    method: GET
    path: /repos/octocat/spoon-knife/branches
    body:
      - name: trunk
        commit: { sha: "d0dd1f61b33d64e29d8bc1372a94ef6a2fee76a9", url: "https://api.github.com/repos/octocat/spoon-knife/commits/d0dd1f61b33d64e29d8bc1372a94ef6a2fee76a9" }
        protected: false
  - connection: sextant-control
    method: POST
    path: /control/ensure
    status: 202
    body: { job_id: 63, identity_hash: "bb04", status: queued, attached: false }
expected:
  status: Completed
  variables:
    status: completed
    targetCount: 3
    upToDate: 0
    ensured: 2
    retired: 0
    skipped: 1
    failed: 0
  httpCalls:
    - connection: sextant-control
      method: GET
      path: /control/resolve
      count: 2
    - connection: sextant-control
      method: POST
      path: /control/ensure
      bodyMatch:
        repository_remote_url: "https://github.com/octocat/hello-world.git"
        commit_sha: "7fd1a60b01f91b314f59955a4e4d4e80d8edf11d"
        branch_name: main
        expected_head_commit: ""
        default_branch: true
      count: 1
    - connection: sextant-control
      method: POST
      path: /control/ensure
      bodyMatch:
        repository_remote_url: "https://github.com/octocat/spoon-knife.git"
        commit_sha: "d0dd1f61b33d64e29d8bc1372a94ef6a2fee76a9"
        branch_name: trunk
        expected_head_commit: ""
        default_branch: true
      count: 1
