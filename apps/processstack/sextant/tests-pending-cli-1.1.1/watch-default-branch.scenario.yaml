name: watch-default-branch
description: >
  (#1) "watch owner/repo" checks the repository is visible to the workspace's GitHub connection, then
  grants the calling user the default branch (PUT /control/grants/self without a branch). The branch is
  already indexed, so no ensure is sent.
entrypoint: configure-watched-repos
principal:
  userId: u-alice
inputs:
  # The prompt-trigger envelope `app test` needs to route SendConnectionMessage (the platform sets these).
  tenantId: "sextant-test"
  applicationInstanceId: "sextant-test-instance"
  conversationId: "conv-watch-default-branch"
  prompt: "watch octocat/hello-world"
  isFirstTurn: false
  channelType: "web"
http:
  # Shape: GitHub REST GET /repos/{owner}/{repo} (read by GitHubGetRepository through Octokit).
  - connection: github
    method: GET
    path: /repos/octocat/hello-world
    body:
      id: 1296269
      name: hello-world
      full_name: octocat/hello-world
      owner: { login: octocat, id: 1 }
      private: false
      default_branch: main
      html_url: "https://github.com/octocat/hello-world"
      clone_url: "https://github.com/octocat/hello-world.git"
  # Shape: PUT /control/grants/self → {grant, created} (src/Sextant.Service.Host/GrantEndpoints.cs).
  - connection: sextant-control
    method: PUT
    path: /control/grants/self
    body:
      grant: { repository: "https://github.com/octocat/hello-world.git", branch: "", source: self, created_at: 1760000000 }
      created: true
  # Shape: GET /control/grants/self → {grants: [{repository, branch, source, created_at, status}], result_count}
  # (src/Sextant.Service.Host/GrantEndpoints.cs, src/Sextant.Service/Grants/GrantContracts.cs).
  - connection: sextant-control
    method: GET
    path: /control/grants/self
    body:
      grants:
        - repository: "https://github.com/octocat/hello-world.git"
          branch: ""
          source: self
          created_at: 1760000000
          status: { resolved_branch: main, snapshot_status: complete }
      result_count: 1
expected:
  status: Completed
  variables:
    verb: watch
    agentResponse: "Now watching octocat/hello-world on main (the default branch)."
  httpCalls:
    - connection: sextant-control
      method: PUT
      path: /control/grants/self
      caller: { act: user, idp: processstack, sub: u-alice }
      bodyMatch: { repository: "https://github.com/octocat/hello-world.git", branch: null }
      count: 1
    - connection: sextant-control
      method: POST
      path: /control/ensure
      count: 0
