name: watch-on-branch
description: >
  (#2) Watching a named branch sends it in the grant and writes the v1 memory entry under …@feature/x.
entrypoint: grant-watch
principal:
  userId: u-alice
inputs:
  host: github.com
  owner: octocat
  repo: hello-world
  branch: feature/x
http:
  # Shape: GitHub REST GET /repos/{owner}/{repo} (read by GitHubGetRepository through Octokit).
  - connection: github
    method: GET
    path: /repos/octocat/hello-world
    body:
      id: 1296269
      name: hello-world
      full_name: octocat/hello-world
      owner: { login: octocat, id: 1 }
      private: false
      default_branch: main
      html_url: "https://github.com/octocat/hello-world"
      clone_url: "https://github.com/octocat/hello-world.git"
  # Shape: PUT /control/grants/self → {grant, created} (src/Sextant.Service.Host/GrantEndpoints.cs).
  - connection: sextant-control
    method: PUT
    path: /control/grants/self
    body:
      grant: { repository: "https://github.com/octocat/hello-world.git", branch: "feature/x", source: self, created_at: 1760000000 }
      created: true
  # Shape: GET /control/grants/self → {grants: [{repository, branch, source, created_at, status}], result_count}
  # (src/Sextant.Service.Host/GrantEndpoints.cs, src/Sextant.Service/Grants/GrantContracts.cs).
  - connection: sextant-control
    method: GET
    path: /control/grants/self
    body:
      grants:
        - repository: "https://github.com/octocat/hello-world.git"
          branch: "feature/x"
          source: self
          created_at: 1760000000
          status: { resolved_branch: main, snapshot_status: complete }
      result_count: 1
expected:
  status: Completed
  variables:
    granted: true
    needsIndex: false
    memoryKeys: "github.com/octocat/hello-world@feature/x"
    memoryValue: '!contains:"branch":"feature/x","cloneUrl":"https://github.com/octocat/hello-world.git"'
    message: "Now watching octocat/hello-world on feature/x."
  httpCalls:
    - connection: sextant-control
      method: PUT
      path: /control/grants/self
      bodyMatch: { repository: "https://github.com/octocat/hello-world.git", branch: feature/x }
      count: 1
